          break;
        }

        case 'cameraShake': {
          const k = dur > 0 ? clamp(1 - age / dur, 0, 1) : 1;
          const amp = (ev.intensity == null ? 0.5 : ev.intensity) * k;
          if (amp > st.shake) st.shake = amp;
          break;
        }

        case 'pulse': {
          const k = dur > 0 ? clamp(1 - age / dur, 0, 1) : 1;
          const s = 1 + ((ev.scale == null ? 1.1 : ev.scale) - 1) * (k * k);
          if (s > st.punch) st.punch = s;
          break;
        }

        case 'color':
          st.accent = ev.color;
          break;

        case 'shape':
          if (ev.sides != null) st.sides = ev.sides;
          if (ev.radius != null) st.radius = ev.radius;
          break;

        default:
          break;   // 未知类型忽略
      }
    }

    return st;
  }

  /* ══════════════════════════════════════════════════════════════════════════
   *  绘制模块 —— 每个都是 (ctx, t, st?) 的纯函数
   * ══════════════════════════════════════════════════════════════════════════*/

  /* ── 模块 1：底色 + 漂移光晕 + 暗角 ─────────────────────────────────────── */
  function drawBackground(ctx, t, st = stateAt(t)) {
    const { W, H, PAD } = CFG;

    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#070b16');
    g.addColorStop(0.55, '#0d0a1c');
    g.addColorStop(1, '#1b0a18');
    ctx.fillStyle = g;
    ctx.fillRect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);

    // 光晕：位置与颜色都是 t 的纯函数
    const cx = W / 2 + Math.sin(t * 0.4) * 260;
    const cy = H * 0.45 + Math.cos(t * 0.31) * 120;
    const r = ctx.createRadialGradient(cx, cy, 0, cx, cy, 900);
    r.addColorStop(0, rgba(st.accent, 0.13));
    r.addColorStop(1, rgba(st.accent, 0));
    ctx.fillStyle = r;
    ctx.fillRect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);

    // 暗角
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = v;
    ctx.fillRect(-PAD, -PAD, W + PAD * 2, H + PAD * 2);
  }

  /* ── 模块 2：漂移网格 ──────────────────────────────────────────────────── */
  function drawGrid(ctx, t, st = stateAt(t)) {
    const { W, H, PAD, gridCols, gridRows, gridSpeed } = CFG;
    const stepX = W / gridCols;
    const stepY = H / gridRows;

    // 用取模让网格无缝循环：位移只由 t 决定，不会累积
    const ox = (t * gridSpeed) % stepX;
    const oy = (t * gridSpeed * 0.5) % stepY;

    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(st.accent, 0.055);

    ctx.beginPath();
    for (let i = -1; i <= gridCols + 1; i++) {
      const x = Math.round(i * stepX + ox) + 0.5;
      ctx.moveTo(x, -PAD);
      ctx.lineTo(x, H + PAD);
    }
    for (let j = -1; j <= gridRows + 2; j++) {
      const y = Math.round(j * stepY + oy) + 0.5;
      ctx.moveTo(-PAD, y);
      ctx.lineTo(W + PAD, y);
    }
    ctx.stroke();

    // 顶部略亮的扫描线，强化"终端"感
    const band = (t * 90) % (H + 200) - 100;
    const bg = ctx.createLinearGradient(0, band - 120, 0, band + 120);
    bg.addColorStop(0, rgba(st.accent, 0));
    bg.addColorStop(0.5, rgba(st.accent, 0.045));
    bg.addColorStop(1, rgba(st.accent, 0));
    ctx.fillStyle = bg;
    ctx.fillRect(-PAD, band - 120, W + PAD * 2, 240);
    ctx.restore();
  }

  /* ── 模块 3：确定性粒子 ────────────────────────────────────────────────────
   * 每个粒子的位置由 (序号 i, t) 直接算出，没有速度积分、没有上一帧坐标。
   * ────────────────────────────────────────────────────────────────────────*/
  function drawParticles(ctx, t, st = stateAt(t)) {
    const { W, H, particleCount } = CFG;

    ctx.save();
    for (let i = 0; i < particleCount; i++) {
      const s = i * 1.37;

      const speed = 10 + hash01(s + 0.11) * 42;     // px/s
      const baseX = hash01(s + 0.37) * W;
      const baseY = hash01(s + 0.71) * H;
      const phase = hash01(s + 0.93) * 6.2831853;

      // 向上漂移并对 H 取模 → 无缝循环
      let y = baseY - t * speed;
      y = y % H;
      if (y < 0) y += H;

      const x = baseX + Math.sin(t * 0.35 + phase) * 20;

      const size = 0.8 + hash01(s + 1.31) * 1.9;
      const twinkle = 0.55 + 0.45 * Math.sin(t * 1.4 + phase);
      const a = (0.08 + hash01(s + 1.77) * 0.32) * twinkle;

      ctx.fillStyle = rgba(st.accent, a);
      ctx.fillRect(x, y, size, size);
    }
    ctx.restore();
  }

  /* ── 模块 4：旋转多边形 ────────────────────────────────────────────────── */
  function drawShape(ctx, t, st = stateAt(t)) {
    const { W } = CFG;
    const cx = W / 2, cy = 500;
    const R = st.radius;
    const N = Math.max(3, st.sides | 0);
    const rot = t * 0.6 + (st.rot || 0);   // 角速度 0.6 rad/s，st.rot 可叠加固定偏角

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      const x = Math.cos(a) * R;
      const y = Math.sin(a) * R;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = rgba(st.accent, 0.07);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = st.accent;
    ctx.stroke();

    ctx.fillStyle = rgba(st.accent, 0.85);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * R, Math.sin(a) * R, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // st.ghost 时只画轮廓，不画参照线与圆心（用于叠在主体后面的陪衬多边形）
    if (st.ghost) return;

    // 圆心 → 基准顶点：让旋转有参照物
    ctx.strokeStyle = rgba(st.accent, 0.22);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(rot) * R, cy + Math.sin(rot) * R);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ── 模块 5：文字层（标题 / 副标题 / 右侧代码流）────────────────────────── */
  function drawCodeText(ctx, t, st = stateAt(t)) {
    const { W, FONT, codeBox, codeLines, codeSpeed } = CFG;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    if (st.headline) {
      // 首帧就可见（0.72），0.35s 内推到 1，并带 14px 上浮
      const k = smooth(0, 0.35, st.headlineAge);
      const a = lerp(0.72, 1, k);
      const rise = (1 - k) * 14;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = 'bold ' + Math.round(56 * (st.headlineSize || 1)) + 'px ' + FONT;
      ctx.shadowColor = rgba(st.accent, 0.5);
      ctx.shadowBlur = 26;
      ctx.fillStyle = st.headlineColor;
      ctx.fillText(st.headline, W / 2, 810 + rise);
      ctx.restore();
    }

    if (st.caption) {
      const k = smooth(0, 0.3, st.captionAge);
      ctx.save();
      ctx.globalAlpha = k * 0.85;
      ctx.font = '22px ' + FONT;
      ctx.fillStyle = '#a0dceb';
      ctx.fillText(st.caption, W / 2, 858);
      ctx.restore();
    }

    // ── 右侧代码流：滚动偏移 = (t * speed) mod 总高度，纯函数 ──
    const LH = 26;
    const n = codeLines.length;
    const span = n * LH;
    const travelled = (t * codeSpeed) % span;
    const firstIdx = Math.floor(travelled / LH);
    const frac = travelled - firstIdx * LH;

    ctx.save();
    ctx.beginPath();
    ctx.rect(codeBox.x, codeBox.y, codeBox.w, codeBox.h);
    ctx.clip();
    ctx.textAlign = 'left';
    ctx.font = '15px ' + FONT;

    const rows = Math.ceil(codeBox.h / LH) + 1;
    for (let k = 0; k < rows; k++) {
      const line = codeLines[(firstIdx + k) % n];
      if (!line) continue;

      const y = codeBox.y + k * LH - frac + LH;
      if (y < codeBox.y - LH || y > codeBox.y + codeBox.h + LH) continue;

      // 上下边缘淡出
      const d = Math.abs(y - (codeBox.y + codeBox.h / 2)) / (codeBox.h / 2);
      const a = 1 - smooth(0.62, 1, d);

      ctx.fillStyle = 'rgba(150,255,230,' + (a * 0.5) + ')';
      ctx.fillText(line, codeBox.x, y);
    }
    ctx.restore();
  }

  /* ── 模块 6：TUI（时间码 / 状态 / 事件日志 / 进度条 / 边角框）───────────── */
  /* ── HUD：只保留左下时间码 + 底部 2px 进度条 ───────────────────────── */
  function drawTUI(ctx, t, st = stateAt(t)) {
    const { W, H, FONT, DURATION, FPS } = CFG;
    const S = 96;
    const p = clamp(t / DURATION, 0, 1);

    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    /* 左下：时间码 */
    ctx.font = 'bold 56px ' + FONT;
    ctx.fillStyle = 'rgba(234,254,255,0.92)';
    ctx.fillText(timecode(t), S, H - 96);

    ctx.font = '17px ' + FONT;
    ctx.fillStyle = 'rgba(140,215,235,0.50)';
    ctx.fillText(
      't ' + t.toFixed(3) + '  /  frame ' + pad(Math.round(t * FPS), 4) +
      '  /  ' + Math.round(DURATION * FPS),
      S + 2, H - 66
    );

    /* 底部：2px 进度条（无刻度、无标签、无百分比） */
    const x0 = S, x1 = W - S, y = H - 40, h = 2;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(x0, y, x1 - x0, h);
    ctx.fillStyle = rgba(st.accent, 0.85);
    ctx.fillRect(x0, y, (x1 - x0) * p, h);
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.fillRect(x0 + (x1 - x0) * p - 0.5, y - 3, 1.5, h + 6);
  }

  /* ══════════════════════════════════════════════════════════════════════════
   *  分镜：每个 scene = { start, end, draw(ctx, t, st) }
   *  draw 同样是纯函数：只调绘制模块，不存状态。
   * ══════════════════════════════════════════════════════════════════════════*/
  const FADE = 0.45;   // 幕间交叉淡入淡出时长（秒）

  /* 每幕用哪几层：level 来自音频分段（quiet / build / peak） */
  const DRAW = {
    quiet(ctx, t, st) {
      drawBackground(ctx, t, st);
      drawGrid(ctx, t, st);
      drawParticles(ctx, t, st);
      drawCodeText(ctx, t, st);
    },
    build(ctx, t, st) {
      drawBackground(ctx, t, st);
      drawGrid(ctx, t, st);
      drawParticles(ctx, t, st);
      drawShape(ctx, t, st);
      drawCodeText(ctx, t, st);
    },
    peak(ctx, t, st) {
      drawBackground(ctx, t, st);
      drawGrid(ctx, t, st);
      drawParticles(ctx, t, st);
      // 内层再套一层反向偏角、多一条边的轮廓多边形
      drawShape(ctx, t, Object.assign({}, st, {
        sides: st.sides + 3,
        radius: st.radius * 0.55,
        rot: Math.PI / 3,
        ghost: true
      }));
      drawShape(ctx, t, st);
      drawCodeText(ctx, t, st);
    },
    outro(ctx, t, st) {
      drawBackground(ctx, t, st);
      drawParticles(ctx, t, st);
      drawShape(ctx, t, st);
      drawCodeText(ctx, t, st);
    }
  };

  /* 分镜表由 SCENE_DEFS（生成数据）派生，几何/时间都在数据里，这里只做映射 */
  const SCENES = SCENE_DEFS.map((d) => ({
    id: d.id,
    start: d.start,
    end: d.end,
    draw: DRAW[d.level] || DRAW.build
  }));

  /* 由 t 选幕 + 算淡入淡出系数 k（0 = 全是当前幕，1 = 全是下一幕）*/
  function sceneAt(t) {
    let index = 0;
    for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i].start) index = i;

    const cur = SCENES[index];
    const next = SCENES[index + 1] || null;

    let k = 0;
    if (next) {
      const from = cur.end - FADE;
      k = smooth(0, 1, clamp((t - from) / FADE, 0, 1));
    }

    return { index: index, cur: cur, next: next, k: k };
  }

  /* ══════════════════════════════════════════════════════════════════════════
   *  渲染入口
   * ══════════════════════════════════════════════════════════════════════════*/

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  let lastT = 0;

  // 交叉淡化用的两张离屏画布（只作缓冲区，不含任何动画状态）
  const bufA = document.createElement('canvas');
  const bufB = document.createElement('canvas');
  let actxA = null;
  let actxB = null;

  function sizeBuffers() {
    const w = Math.round(CFG.W * CFG.dpr);
    const h = Math.round(CFG.H * CFG.dpr);
    bufA.width = w; bufA.height = h;
    bufB.width = w; bufB.height = h;
    actxA = bufA.getContext('2d', { alpha: false });
    actxB = bufB.getContext('2d', { alpha: false });
  }

  function setupCanvas() {
    CFG.dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    canvas.width = Math.round(CFG.W * CFG.dpr);
    canvas.height = Math.round(CFG.H * CFG.dpr);
    canvas.style.width = CFG.W + 'px';
    canvas.style.height = CFG.H + 'px';
    sizeBuffers();
  }

  // 窗口小于 1920x1080 时整体等比缩放（只为观看；视口正好 1920x1080 时 scale === 1）
  function fitStage() {
    const s = Math.min(window.innerWidth / CFG.W, window.innerHeight / CFG.H);
    canvas.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }

  /* 把一幕画到任意 2D 上下文（主画布或离屏缓冲区）*/
  function paintScene(c, scene, t, st) {
    const { W, H, FPS } = CFG;

    c.setTransform(CFG.dpr, 0, 0, CFG.dpr, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.shadowBlur = 0;
    c.shadowColor = 'transparent';

    // 相机：抖动用固定 hash 生成位移（按帧量化），推镜绕画面中心缩放
    const amp = st.shake * 26;
    let dx = 0, dy = 0;
    if (amp > 0.001) {
      const s = Math.floor(t * FPS);
      dx = (hash01(s * 1.7) - 0.5) * 2 * amp;
      dy = (hash01(s * 2.3 + 91) - 0.5) * 2 * amp;
    }

    c.save();
    if (dx || dy) c.translate(dx, dy);
    if (st.punch !== 1) {
      c.translate(W / 2, H / 2);
      c.scale(st.punch, st.punch);
      c.translate(-W / 2, -H / 2);
    }

    scene.draw(c, t, st);

    c.restore();
  }

  /* ══════════════════════════════════════════════════════════════════════════
   *  v2 管线：分镜表驱动
   *  shots → cfg.events → 事件仲裁 → 模块绘制 → 转场合成 → HUD → 全局闪光
   *  全部由 t 决定，无跨帧状态，无定时器。
   * ══════════════════════════════════════════════════════════════════════════*/

  const V2_TOTAL = 211.907;   /* = TRACK.duration，分镜表按此值生成 */  // 与 TOTAL_SECONDS 一致
  const PALETTE = {
    mint: '#5ef2d0', red: '#ff2f6d', violet: '#a06bff', plum: '#7a3ea8',
    tomato: '#e8503a', amber: '#e8b23a', white: '#eafeff', blue: '#4f7fff',
    ink: '#05070e'
  };

  /* 同帧多事件的仲裁顺序（低 → 高，后者可覆盖前者） */
  const ARB = ['sceneSwitch', 'paletteShift', 'text', 'shake', 'glitch', 'flash', 'flush'];

  /* 自有文字的模块：文字层不再重复绘制 */
  const OWNS_TEXT = { 'sc.titleDrop': true, 'sc.finalCard': true };

  /* 每镜一个固定的布光位与色相（只由镜头序号决定，纯函数） */
  const SHOT_INDEX = {};
  for (let i = 0; i < SHOTS.length; i++) SHOT_INDEX[SHOTS[i].id] = i;
  const SHOT_HUES = ['#5ef2d0', '#ff2f6d', '#a06bff', '#4f7fff', '#e8b23a', '#e8503a'];

  /* 二分：最后一个 startRatio <= ratio 的镜 */
  function findShot(ratio) {
    let lo = 0, hi = SHOTS.length - 1, ans = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (SHOTS[mid].startRatio <= ratio) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  /* 全局歌词索引（跨镜持久：一条 text 一直有效到下一条 text） */
  const TEXT_EVENTS = (function () {
    const a = [];
    for (let s = 0; s < SHOTS.length; s++) {
      const evs = SHOTS[s].timelineEvents;
      for (let k = 0; k < evs.length; k++) {
        if (evs[k].type === 'text') {
          a.push({ at: evs[k].atRatio * V2_TOTAL, shot: s, payload: evs[k].payload });
        }
      }
    }
    a.sort(function (x, y) { return x.at - y.at; });
    return a;
  })();

  /* 当前该显示哪条文字：persist 保持到下一条；pulse 只在 hold 秒内 */
  function textAt(tc) {
    let cur = null;
    for (let i = 0; i < TEXT_EVENTS.length; i++) {
      if (TEXT_EVENTS[i].at <= tc + 1e-6) cur = TEXT_EVENTS[i]; else break;
    }
    if (!cur) return null;
    const p = cur.payload;
    const age = tc - cur.at;
    if (p.mode === 'pulse') {
      const hold = p.hold > 0 ? p.hold : 0.5;
      if (age < 0 || age >= hold) return null;
      const u = age / hold;
      const a = smooth(0, 0.10, u) * smooth(0, 0.34, 1 - u);
      return { text: p.text, style: p.style, mode: 'pulse', alpha: a, age: age, at: cur.at };
    }
    const a = 0.55 + 0.45 * smooth(0, 0.22, age);
    return { text: p.text, style: p.style, mode: 'persist', alpha: a, age: age, at: cur.at };
  }

  /* 状态：把本镜事件按仲裁顺序合并成一个纯数据快照 */
  function shotState(shot, tc) {
    const evs = shot.timelineEvents;
    let accent = null, accentMix = 0, accentAge = 1e9;
    let shake = 0, glitch = 0, glitchAmp = 0;
    let flash = 0, flashColor = PALETTE.white;
    let flush = 0, flushColor = PALETTE.white;

    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      const at = e.atRatio * V2_TOTAL;
      const age = tc - at;
      if (age < -1e-9) continue;
      const p = e.payload || {};

      if (e.type === 'paletteShift') {
        if (age < accentAge - 1e-9) { accentAge = age; accent = p.to; accentMix = p.mix == null ? 0.3 : p.mix; }
      } else if (e.type === 'shake') {
        const dur = p.decay > 0 ? p.decay : 0.55;
        const k = clamp(1 - age / dur, 0, 1);
        shake = Math.max(shake, (p.intensity == null ? 0.2 : p.intensity) * k);
      } else if (e.type === 'glitch') {
        const dur = p.decay > 0 ? p.decay : 0.30;
        const k = clamp(1 - age / dur, 0, 1);
        if (k > glitch) { glitch = k; glitchAmp = p.amp == null ? 30 : p.amp; }
      } else if (e.type === 'flash') {
        const dur = p.duration > 0 ? p.duration : 0.45;
        const s = p.strength == null ? 0.3 : p.strength;
        const k = Math.pow(clamp(1 - age / dur, 0, 1), 1.6) * s;
        if (k > flash) { flash = k; flashColor = p.color || PALETTE.white; }
      } else if (e.type === 'flush') {
        const dur = p.duration > 0 ? p.duration : 0.9;
        const s = p.strength == null ? 0.4 : p.strength;
        const k = clamp(1 - age / dur, 0, 1) * s;
        if (k > flush) { flush = k; flushColor = p.color || PALETTE.white; }
      }
    }

    if (!accent) {
      /* 没有 paletteShift 就用本镜第一条 flash 的颜色，再退默认 */
      for (let i = 0; i < evs.length; i++) {
        if (evs[i].type === 'flash' && evs[i].payload && evs[i].payload.color) { accent = evs[i].payload.color; break; }
      }
      accent = accent || PALETTE.mint;
    }

    return {
      accent: accent, accentMix: accentMix, accentAge: accentAge,
      shake: shake, glitch: glitch, glitchAmp: glitchAmp,
      flash: flash, flashColor: flashColor,
      flush: flush, flushColor: flushColor,
      punch: 1, sides: 3, radius: 190, rot: 0
    };
  }

  /* 给模块看的事件切片（含 localRatio，仍然只由 t 决定） */
  function evView(shot, tc) {
    const start = shot.startRatio * V2_TOTAL;
    const out = [];
    for (let i = 0; i < shot.timelineEvents.length; i++) {
      const e = shot.timelineEvents[i];
      const at = e.atRatio * V2_TOTAL;
      if (at > tc + 1e-6) break;
      out.push({
        type: e.type,
        atRatio: e.atRatio,
        localRatio: clamp((at - start) / (shot.endRatio - shot.startRatio) / V2_TOTAL, 0, 1),
        age: tc - at,
        payload: e.payload || {}
      });
    }
    return out;
  }

  function cfgOf(shot, tc) {
    const st = shotState(shot, tc);
    return {
      variant: shot.variant, W: CFG.W, H: CFG.H, FONT: CFG.FONT,
      palette: PALETTE, scene: shot,
      events: evView(shot, tc), state: st
    };
  }

  /* 相机：抖动按帧量化哈希，和 t 一一对应 */
  function paintShot(c, shot, tc, localT, st, cfg) {
    const { W, H, FPS } = CFG;
    c.setTransform(CFG.dpr, 0, 0, CFG.dpr, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.shadowBlur = 0;
    c.shadowColor = 'transparent';
    c.clearRect(0, 0, W, H);

    const amp = st.shake * 26;
    let dx = 0, dy = 0;
    if (amp > 0.001) {
      const s = Math.floor(tc * FPS);
      dx = (hash01(s * 1.7) - 0.5) * 2 * amp;
      dy = (hash01(s * 2.3 + 91) - 0.5) * 2 * amp;
    }

    c.save();
    if (dx || dy) c.translate(dx, dy);
    if (st.punch !== 1) {
      c.translate(W / 2, H / 2); c.scale(st.punch, st.punch); c.translate(-W / 2, -H / 2);
    }

    const fn = MODULES[shot.renderModule];
    if (fn) fn(c, tc, localT, cfg);
    else {
      c.fillStyle = PALETTE.ink; c.fillRect(0, 0, W, H);
      c.fillStyle = 'rgba(234,254,255,0.5)';
      c.font = '24px ' + CFG.FONT;
      c.fillText('未实现模块 ' + shot.renderModule, 96, 96);
    }
    shotGrade(c, shot, W, H);
    c.restore();
  }

  /* 每镜的底色偏移 + 偏移辉光：让 50 个镜头不像同一个房间 */
  function shotGrade(c, shot, W, H) {
    if (shot.id === 'S46') return;
    const i = SHOT_INDEX[shot.id] || 0;
    const hue = SHOT_HUES[i % SHOT_HUES.length];
    const gx = 0.18 + 0.64 * hash01(i * 3.31 + 1.7);
    const gy = 0.06 + 0.26 * hash01(i * 7.93 + 4.2);
    const ga = 0.10 + 0.10 * hash01(i * 11.3 + 2.5);
    const ta = 0.032 + 0.026 * hash01(i * 5.7 + 8.1);

    const g1 = c.createLinearGradient(0, 0, 0, H);
    g1.addColorStop(0, rgba(hue, ta));
    g1.addColorStop(0.58, rgba(hue, 0));
    c.fillStyle = g1;
    c.fillRect(0, 0, W, H);

    const r = Math.max(W, H) * 0.74;
    const g2 = c.createRadialGradient(W * gx, H * gy, 0, W * gx, H * gy, r);
    g2.addColorStop(0, rgba(hue, ga));
    g2.addColorStop(1, rgba(hue, 0));
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = g2;
    c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'source-over';
  }

  /* ── 转场合成（全部在设备像素空间，p: 0=旧，1=新）────────────────────── */
  function compose(ctx, type, p, A, B) {
    const W = Math.round(CFG.W * CFG.dpr), H = Math.round(CFG.H * CFG.dpr);
    const e = smooth(0, 1, clamp(p, 0, 1));
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = PALETTE.ink;
    ctx.fillRect(0, 0, W, H);

    if (type === 'flash') {
      ctx.drawImage(B, 0, 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - e) * 0.55;
      ctx.fillStyle = PALETTE.white;
      ctx.fillRect(0, 0, W, H);
    } else if (type === 'fade') {
      ctx.drawImage(A, 0, 0);
      ctx.globalAlpha = e;
      ctx.drawImage(B, 0, 0);
    } else if (type === 'wipeH') {
      ctx.drawImage(A, 0, 0);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W * e, H); ctx.clip();
      ctx.drawImage(B, 0, 0);
      ctx.restore();
    } else if (type === 'wipeV') {
      ctx.drawImage(A, 0, 0);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, H * e); ctx.clip();
      ctx.drawImage(B, 0, 0);
      ctx.restore();
    } else if (type === 'iris') {
      ctx.drawImage(A, 0, 0);
      ctx.save();
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, e * Math.sqrt(W * W + H * H) * 0.5, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(B, 0, 0);
      ctx.restore();
    } else if (type === 'gridCollapse') {
      ctx.drawImage(A, 0, 0);
      const cols = 24, rows = 13;
      const tw = W / cols, th = H / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const rnd = hash01(r * 31.7 + c * 7.3 + 0.5);
          const k = clamp((e - rnd * 0.45) / 0.55, 0, 1);
          if (k <= 0.001) continue;
          ctx.globalAlpha = k;
          ctx.drawImage(B, c * tw, r * th, tw + 1, th + 1, c * tw, r * th, tw + 1, th + 1);
        }
      }
      ctx.globalAlpha = 1;
    } else if (type === 'glitchSlice') {
      ctx.drawImage(B, 0, 0);
      const n = 8, bh = H / n;
      const ph = Math.floor(p * 48);
      ctx.globalAlpha = 1 - e;
      for (let i = 0; i < n; i++) {
        const dx = (hash01(i * 13.7 + ph * 1.3 + 0.5) - 0.5) * 140 * CFG.dpr * e;
        ctx.drawImage(A, 0, i * bh, W, bh, dx, i * bh, W, bh);
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.drawImage(B, 0, 0);
    }
    ctx.restore();
  }

  /* 全屏故障：把画面按横带错位（对自身取样，纯函数） */
  function glitchFrame(ctx, tc, amount, amp) {
    if (amount <= 0.002) return;
    const W = Math.round(CFG.W * CFG.dpr), H = Math.round(CFG.H * CFG.dpr);
    const n = 5, bh = H / n;
    const fr = Math.floor(tc * CFG.FPS);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < n; i++) {
      const dx = (hash01(fr * 3.1 + i * 7.3 + 0.5) - 0.5) * (amp * 2.6) * CFG.dpr * amount;
      ctx.drawImage(canvas, 0, i * bh, W, bh, dx, i * bh, W, bh);
    }
    ctx.restore();
  }

  /* 后期质感：扫描线 / 颗粒 / 暗角（全部按帧量化，确定性） */
  let grainTile = null, scanTile = null;
  function makeGrain() {
    if (grainTile) return grainTile;
    const cv = document.createElement('canvas');
    cv.width = 220; cv.height = 220;
    const g = cv.getContext('2d');
    const img = g.createImageData(220, 220);
    let s = 20240607;
    for (let i = 0; i < 220 * 220; i++) {
      s = (s * 1664525 + 1013904223) >>> 0;
      const v = s / 4294967296;
      img.data[i * 4] = 255;
      img.data[i * 4 + 1] = 255;
      img.data[i * 4 + 2] = 255;
      img.data[i * 4 + 3] = v > 0.9962 ? Math.floor(((v - 0.9962) / 0.0038) * 150) : 0;
    }
    g.putImageData(img, 0, 0);
    grainTile = cv;
    return grainTile;
  }
  function makeScan() {
    if (scanTile) return scanTile;
    const cv = document.createElement('canvas');
    cv.width = 2; cv.height = 4;
    const g = cv.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,0.30)';
    g.fillRect(0, 0, 2, 1);
    scanTile = cv;
    return scanTile;
  }

  function postFX(ctx, tc) {
    const W = CFG.W, H = CFG.H, dpr = CFG.dpr;
    const fr = Math.floor(tc * CFG.FPS);
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    ctx.globalAlpha = 0.42;
    ctx.fillStyle = ctx.createPattern(makeScan(), 'repeat');
    ctx.fillRect(0, 0, W, H);

    const ox = -Math.floor(hash01(fr * 1.7) * 220);
    const oy = -Math.floor(hash01(fr * 2.9 + 7) * 220);
    ctx.translate(ox, oy);
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = ctx.createPattern(makeGrain(), 'repeat');
    ctx.fillRect(-ox, -oy, W, H);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.40, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(3,4,10,0)');
    vg.addColorStop(1, 'rgba(3,4,10,0.58)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* ══════════════════════════════════════════════════════════════════════════
   *  场景模块：function (ctx, t, localT, cfg)  —— 纯函数
   * ══════════════════════════════════════════════════════════════════════════*/
  const MODULES = {};

  function mono(ctx, size, weight) {
    ctx.font = (weight ? weight + ' ' : '') + size + 'px ' + CFG.FONT;
  }

  /* 公共底：背景 + 网格 + 粒子（复用已有图层，仍是纯函数） */
  function stage(ctx, t, st) {
    drawBackground(ctx, t, st);
    drawGrid(ctx, t, st);
    drawParticles(ctx, t, st);
  }

  /* ── S01 通电 ─────────────────────────────────────────────────────────── */
  MODULES['sc.powerLed'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const y = 620;
    const grow = smooth(0, 0.85, localT);
    const x0 = 560, x1 = 1360;
    const xe = x0 + (x1 - x0) * grow;

    /* 导轨 */
    ctx.strokeStyle = 'rgba(94,242,208,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(xe, y); ctx.stroke();

    /* 刻度：每 40px 一根，越往后越暗 */
    for (let x = x0; x <= xe; x += 40) {
      const k = (x - x0) / (x1 - x0);
      ctx.strokeStyle = 'rgba(94,242,208,' + (0.10 + 0.30 * (1 - k)).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
    }

    /* 电压包络 */
    ctx.strokeStyle = 'rgba(234,254,255,0.20)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = x0; x <= xe; x += 6) {
      const u = (x - x0) / (x1 - x0);
      const a = Math.sin(u * 34 + t * 5.2) * 26 * Math.sin(u * Math.PI) * grow;
      if (x === x0) ctx.moveTo(x, y - 60 + a); else ctx.lineTo(x, y - 60 + a);
    }
    ctx.stroke();

    /* LED：通电那一刻点亮 */
    const on = smooth(1.20, 1.60, localT + 0.02);
    const r = 9 + 3 * on;
    ctx.beginPath(); ctx.arc(x0, y, r, 0, Math.PI * 2);
    ctx.fillStyle = on > 0.02 ? 'rgba(94,242,208,' + (0.55 + 0.45 * on).toFixed(3) + ')' : 'rgba(94,242,208,0.18)';
    ctx.fill();
    if (on > 0.02) {
      const g = ctx.createRadialGradient(x0, y, 0, x0, y, 120);
      g.addColorStop(0, 'rgba(94,242,208,' + (0.30 * on).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(94,242,208,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x0 - 120, y - 120, 240, 240);
    }

    /* 右侧读数 */
    mono(ctx, 15, '');
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('LINE IN   ' + (on > 0.5 ? 'ON' : 'OFF'), x1, y - 92);
    ctx.fillText('VOLT      ' + (on * 220).toFixed(1) + ' V', x1, y - 70);
    ctx.textAlign = 'left';
  };

  /* ── S02 启动日志（防护自检）───────────────────────────────────────────── */
  const BOOT_LINES = [
    'mount /dev/world ................ OK',
    'load actor.points ............... OK',
    'load actor.circle ............... OK',
    'load actor.sine ................. OK',
    'assert self.purpose != null ..... OK',
    'enable PROTECTION ............... OK'
  ];
  MODULES['sc.bootLog'] = function (ctx, t, localT, cfg) {
    const { H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const x = 520, y = 300, w = 880, h = 430;
    ctx.fillStyle = 'rgba(5,7,14,0.72)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(94,242,208,0.28)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    /* 标题栏 */
    ctx.fillStyle = 'rgba(94,242,208,0.08)';
    ctx.fillRect(x, y, w, 34);
    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.65)';
    ctx.fillText('boot.log  ·  pid 1440', x + 16, y + 23);

    /* 逐行打字 */
    const step = 0.30;
    for (let i = 0; i < BOOT_LINES.length; i++) {
      const a = smooth(i * step, i * step + 0.16, localT);
      if (a <= 0.001) continue;
      const shown = Math.floor(clamp((localT - i * step) / 0.16, 0, 1) * BOOT_LINES[i].length);
      const ly = y + 76 + i * 46;
      ctx.globalAlpha = a;
      mono(ctx, 19, '');
      ctx.fillStyle = 'rgba(234,254,255,0.82)';
      ctx.fillText(BOOT_LINES[i].slice(0, shown), x + 28, ly);
      if (shown >= BOOT_LINES[i].length) {
        ctx.fillStyle = 'rgba(94,242,208,0.9)';
        ctx.fillText('■', x + w - 52, ly);
      }
      ctx.globalAlpha = 1;
    }

    /* 底部进度 */
    const p = smooth(0.2, 1.9, localT);
    const bx = x + 28, by = y + h - 30, bw = w - 120;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, 3);
    ctx.fillStyle = 'rgba(94,242,208,0.85)';
    ctx.fillRect(bx, by, bw * p, 3);
    mono(ctx, 13, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText(Math.round(p * 100) + '%', bx + bw + 14, by + 5);
  };

  /* ── S03 点阵归位（造物）───────────────────────────────────────────────── */
  /* 电流：一条抖动折线，外带一层辉光 */
  function dgArc(ctx, x0, y0, x1, y1, seed, sh) {
    const segs = 5 + Math.floor(hash01(seed + 12.5) * 5);
    const nx = -(y1 - y0), ny = (x1 - x0);
    const len = Math.sqrt(nx * nx + ny * ny) || 1;
    const ux = nx / len, uy = ny / len;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    for (let i = 1; i < segs; i++) {
      const u = i / segs;
      const off = (hash01(seed + i * 7.3) - 0.5) * 28;
      ctx.lineTo(x0 + (x1 - x0) * u + ux * off, y0 + (y1 - y0) * u + uy * off);
    }
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = 'rgba(94,242,208,' + (0.16 * sh).toFixed(3) + ')';
    ctx.lineWidth = 4.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(210,255,248,' + (0.28 + 0.5 * sh).toFixed(3) + ')';
    ctx.lineWidth = 0.9 + hash01(seed + 3.3) * 1.3;
    ctx.stroke();
  }

  /* ── S03 点阵（铺开 / 电流 / 参数化 / 红点埋线）────────────────────────── */
  MODULES['sc.dotGrid'] = function (ctx, t, localT, cfg) {
    const W = CFG.W, H = CFG.H;
    const st = cfg.state;
    stage(ctx, t, st);

    const cols = 24, rows = 13, N = cols * rows;
    const gw = 1120, gh = 560, gx = (W - gw) / 2, gy = 300;
    const sx = gw / (cols - 1), sy = gh / (rows - 1);

    /* 震动强度：直接跟本镜的 shake 事件走，好按 intensity 归一 */
    let sh = 0;
    for (let i = 0; i < cfg.events.length; i++) {
      const ev = cfg.events[i];
      if (ev.type !== 'shake' || ev.age < 0) continue;
      const g = clamp(1 - ev.age / 1.15, 0, 1);
      const inten = (ev.payload && ev.payload.intensity) || 0.3;
      sh = Math.max(sh, g * Math.min(1.15, inten / 0.15));
    }
    const fr = Math.floor(t * CFG.FPS);

    /* 每个点的位置：个体化的抖动频率与幅度，震动时不会整块同步 */
    const px = [], py = [], pa = [], pr = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        const stagger = (hash01(i * 3.1 + 0.3) * 0.55) + (i / N) * 0.45;
        const k = smooth(stagger * 1.15, stagger * 1.15 + 0.55, localT);
        const tx = gx + c * sx, ty = gy + r * sy;
        const ox = hash01(i * 7.7 + 1.1) * W;
        const oy = hash01(i * 11.3 + 2.7) * H;

        const fx = 9 + hash01(i * 5.9 + 0.7) * 8;
        const fy = 11 + hash01(i * 8.3 + 2.1) * 8;
        const jx = Math.sin(t * fx + i * 1.7) * (5 + hash01(i * 2.3) * 8);
        const jy = Math.cos(t * fy + i * 2.9) * (4 + hash01(i * 4.7) * 9);

        px[i] = ox + (tx - ox) * k + jx * sh;
        py[i] = oy + (ty - oy) * k + jy * sh;
        pa[i] = (0.10 + 0.55 * k) * k;
        pr[i] = 1.4 + 1.6 * k;
      }
    }

    /* 异常点：固定挑一小撮，随镜慢慢渗成红色 —— 给后文 ILLEGAL ARGUMENTS 埋线 */
    const reds = [];
    for (let i = 0; i < N; i++) if (hash01(i * 13.7 + 5.5) < 0.052) reds.push(i);
    const isRed = {};
    for (let r = 0; r < reds.length; r++) isRed[reds[r]] = r;

    for (let i = 0; i < N; i++) {
      if (isRed[i] !== undefined) continue;
      ctx.beginPath(); ctx.arc(px[i], py[i], pr[i], 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(94,242,208,' + pa[i].toFixed(3) + ')';
      ctx.fill();
    }

    for (let r = 0; r < reds.length; r++) {
      const i = reds[r];
      const born = clamp((localT - (1.55 + r * 0.23)) / 0.55, 0, 1);
      if (born <= 0) {
        ctx.beginPath(); ctx.arc(px[i], py[i], pr[i], 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(94,242,208,' + pa[i].toFixed(3) + ')';
        ctx.fill();
        continue;
      }
      const pl = 0.55 + 0.45 * Math.sin(t * (3.1 + r * 0.7) + r * 2.3);
      const g2 = ctx.createRadialGradient(px[i], py[i], 0, px[i], py[i], 17);
      g2.addColorStop(0, 'rgba(255,47,109,' + (0.60 * born * (0.55 + 0.45 * pl)).toFixed(3) + ')');
      g2.addColorStop(1, 'rgba(255,47,109,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(px[i], py[i], 17, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px[i], py[i], pr[i] + 0.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,96,136,' + (born * (0.70 + 0.30 * pl)).toFixed(3) + ')';
      ctx.fill();
    }

    /* 电流：只在震动窗口里出现，每次重新抽点，逐帧变化 */
    if (sh > 0.02) {
      const arcs = 10;
      for (let a = 0; a < arcs; a++) {
        const seed = fr * 31.7 + a * 97.3;
        /* 一半的弧从红点起飞，让异常点看着像在漏电 */
        let from = Math.floor(hash01(seed + 1.3) * N);
        if (reds.length && hash01(seed + 21.7) < 0.45) {
          from = reds[Math.floor(hash01(seed + 33.1) * reds.length) % reds.length];
        }
        const horizontal = hash01(seed + 8.1) < 0.6;
        const cells = 1 + Math.floor(hash01(seed + 44.9) * 3);
        const dir = hash01(seed + 4.7) < 0.5 ? -1 : 1;
        let to;
        if (horizontal) {
          const row = Math.floor(from / cols);
          const col = (from % cols) + dir * cells;
          if (col < 0 || col >= cols) continue;
          to = row * cols + col;
        } else {
          const row = Math.floor(from / cols) + dir * cells;
          if (row < 0 || row >= rows) continue;
          to = row * cols + (from % cols);
        }
        dgArc(ctx, px[from], py[from], px[to], py[to], seed, sh);

        /* 端点火花：让弧看起来真的接在点上 */
        for (let q = 0; q < 2; q++) {
          const ex = q ? px[to] : px[from];
          const ey = q ? py[to] : py[from];
          const g3 = ctx.createRadialGradient(ex, ey, 0, ex, ey, 10);
          g3.addColorStop(0, 'rgba(220,255,250,' + (0.55 * sh).toFixed(3) + ')');
          g3.addColorStop(1, 'rgba(94,242,208,0)');

  /* ── S04 参数面板（被定义）─────────────────────────────────────────────── */
  const PARAMS = [

  /* ── S05 世界生成 ──────────────────────────────────────────────────────── */
  /* ── S05 世界树：一次性烘焙的确定性节点云（根 → 子 → 孙 → 玄孙）────────────
   *  物理只在页面加载时算一次（固定 dt、固定种子），之后每秒只是查表插值，
   *  所以 renderAt(t) 依旧是纯函数：同一个 t 永远同样一批像素。            */
  let WT = null;

  function worldTreeBake() {
    if (WT) return WT;

    const rnd = function (k) { return hash01(k * 12.9898 + 4.1414); };
    const nodes = [];
    const LIMIT = 240;

    const add = function (parent, level, birth, ux, uy, uz) {
      const i = nodes.length;
      let kids = 0;
      if (level === 0) kids = 7;
      else if (level === 1) kids = 3 + Math.floor(rnd(i * 3.7 + 1.3) * 3);
      else if (level === 2) kids = 2 + Math.floor(rnd(i * 5.1 + 2.7) * 3);
      else if (level === 3) kids = 1 + Math.floor(rnd(i * 7.3 + 3.9) * 2);
      else if (level === 4) kids = 1 + Math.floor(rnd(i * 9.1 + 4.4) * 2);
      nodes.push({
        parent: parent, level: level, birth: birth, kids: kids,
        childIds: [], ux: ux, uy: uy, uz: uz
      });
      return i;
    };

    add(-1, 0, 0, 0, 0, 0);
    const queue = [0];
    while (queue.length && nodes.length < LIMIT) {
      const pi = queue.shift();
      const p = nodes[pi];
      if (p.level >= 5) continue;
      const want = Math.min(p.kids, LIMIT - nodes.length);
      for (let k = 0; k < want; k++) {
        const a = (k / Math.max(1, want)) * Math.PI * 2 + rnd(pi * 11.1 + k * 3.3) * 1.5;
        const el = (rnd(pi * 5.7 + k * 7.7) - 0.5) * 1.35;
        const ce = Math.cos(el);
        const ux = Math.cos(a) * ce, uy = Math.sin(el), uz = Math.sin(a) * ce;
        const birth = p.birth + 0.03 + rnd(pi * 2.3 + k * 9.1) * 0.06 + p.level * 0.16;
        const ci = add(pi, p.level + 1, birth, ux, uy, uz);
        p.childIds.push(ci);
        queue.push(ci);
      }
    }

    const n = nodes.length;
    const DT = 1 / 60;
    const STEPS = 170;
    const pos = new Float32Array(n * STEPS * 3);
    const vx = new Float32Array(n), vy = new Float32Array(n), vz = new Float32Array(n);
    const live = new Uint8Array(n);
    const bstep = new Int16Array(n);
    for (let i = 0; i < n; i++) bstep[i] = Math.round(nodes[i].birth / DT);

    /* 等级越高，斥力越强 */
    const REP = [0.9, 1.8, 3.0, 4.6, 6.2, 7.8];
    const KICK = 190;      /* 出生时的反向 Δv */
    const BIRTHV = 300;    /* 子节点的出射速度 */
    const DAMP = 0.978;
    const MAXV = 760;
    const SOFT = 0.0018;
    const CUT = 128;

    vx[0] = 22; vy[0] = -8; vz[0] = 15;
    live[0] = 1;

    for (let s = 0; s < STEPS; s++) {
      /* 出生：子节点拿方向速度，父节点拿反向的较大 Δv */
      for (let i = 1; i < n; i++) {
        if (bstep[i] !== s) continue;
        const p = nodes[i].parent;
        const bi = (i * STEPS + s) * 3;
        const bp = (p * STEPS + s) * 3;
        const px = pos[bp], py = pos[bp + 1], pz = pos[bp + 2];
        live[i] = 1;
        pos[bi] = px + nodes[i].ux * 7;
        pos[bi + 1] = py + nodes[i].uy * 7;
        pos[bi + 2] = pz + nodes[i].uz * 7;

        const boost = p.level === 0 ? 1.45 : 1;
        vx[i] = vx[p] * 0.42 + nodes[i].ux * BIRTHV * boost;
        vy[i] = vy[p] * 0.42 + nodes[i].uy * BIRTHV * boost;
        vz[i] = vz[p] * 0.42 + nodes[i].uz * BIRTHV * boost;

        vx[p] -= nodes[i].ux * KICK;
        vy[p] -= nodes[i].uy * KICK;
        vz[p] -= nodes[i].uz * KICK;
      }

      /* 逐对斥力 */
      for (let i = 0; i < n; i++) {
        if (!live[i]) continue;
        const bi = (i * STEPS + s) * 3;
        for (let j = i + 1; j < n; j++) {
          if (!live[j]) continue;
          const bj = (j * STEPS + s) * 3;
          let dx = pos[bj] - pos[bi];
          let dy = pos[bj + 1] - pos[bi + 1];
          let dz = pos[bj + 2] - pos[bi + 2];
          let d2 = dx * dx + dy * dy + dz * dz;
          if (d2 < 1) { dx = 0.7; dy = 0.5; dz = 0.3; d2 = 1; }
          if (d2 > CUT * CUT) continue;
          const d = Math.sqrt(d2);
          let f = (REP[nodes[i].level] * REP[nodes[j].level]) * 900 / d2;
          if (f > 2600) f = 2600;
          const fx = dx / d * f, fy = dy / d * f, fz = dz / d * f;
          vx[j] += fx * DT; vy[j] += fy * DT; vz[j] += fz * DT;
          vx[i] -= fx * DT; vy[i] -= fy * DT; vz[i] -= fz * DT;
        }
      }

      /* 软回拉 + 阻尼 + 积分 */
      for (let i = 0; i < n; i++) {
        if (!live[i]) continue;
        const b = (i * STEPS + s) * 3;
        const x = pos[b], y = pos[b + 1], z = pos[b + 2];
        const pull = i === 0 ? 1.25 : SOFT;
        vx[i] -= x * pull;
        vy[i] -= y * (i === 0 ? 1.7 : SOFT * 1.35);
        vz[i] -= z * pull;
        vx[i] *= DAMP; vy[i] *= DAMP; vz[i] *= DAMP;
        const sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]);
        if (sp > MAXV) {
          const k = MAXV / sp;
          vx[i] *= k; vy[i] *= k; vz[i] *= k;
        }
        if (s + 1 < STEPS) {
          const nb = (i * STEPS + s + 1) * 3;
          pos[nb] = x + vx[i] * DT;
          pos[nb + 1] = y + vy[i] * DT;
          pos[nb + 2] = z + vz[i] * DT;
        }
      }
    }

    WT = { nodes: nodes, pos: pos, n: n, STEPS: STEPS, bstep: bstep };
    return WT;
  }

  /* ── S05 新世界（透视地板 + 自生长的节点世界树）──────────────────────────── */
  MODULES['sc.worldGrid'] = function (ctx, t, localT, cfg) {
    const W = CFG.W, H = CFG.H;
    const st = cfg.state;
    stage(ctx, t, st);

    const horizon = 640;
    const grow = smooth(0, 1.1, localT);

    let age = -1;
    for (let i = 0; i < cfg.events.length; i++) {
      const e = cfg.events[i];
      if (e.type === 'text' && e.payload && e.payload.text === 'SIMULATION') age = e.age;
    }

    }

    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(234,254,255,' + (0.20 + 0.30 * grow).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, horizon); ctx.lineTo(W * grow, horizon); ctx.stroke();

    /* 状态灯 */
    if (on < 0.92) {
      const br = 0.55 + 0.45 * Math.sin(t * 3.2);
      ctx.beginPath(); ctx.arc(W / 2, horizon - 96, 7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(94,242,208,' + ((1 - on) * (0.45 + 0.55 * br)).toFixed(3) + ')';
      ctx.fill();
    }

    let born = 0;

    if (age > 0.001) {
      const tree = worldTreeBake();
      const nodes = tree.nodes, pos = tree.pos, n = tree.n;
      const STEPS = tree.STEPS, bstep = tree.bstep;

      let sf = age * 60;
      if (sf > STEPS - 2) sf = STEPS - 2;
      if (sf < 0) sf = 0;
      const s0 = Math.floor(sf);
      const frc = sf - s0;
      const s1 = Math.min(s0 + 1, STEPS - 1);

      /* 整体缓慢自转 + 呼吸，给立体感 */
      const ang = 0.30 + t * 0.17;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const CX = W / 2, CY = 452;
      const F = 980, MS = 1.55;
      const breathe = 1 + 0.02 * Math.sin(t * 2.3);

      /* 原点白热：台词一出现的头 0.26s */
      if (age < 0.26) {
        const f = 1 - age / 0.26;
        const g0 = ctx.createRadialGradient(CX, CY, 0, CX, CY, 210 * (1.4 - f * 0.4));
        g0.addColorStop(0, 'rgba(234,254,255,' + (0.55 * f * smooth(0, 0.07, age)).toFixed(3) + ')');
        g0.addColorStop(0.45, 'rgba(94,242,208,' + (0.22 * f).toFixed(3) + ')');
        g0.addColorStop(1, 'rgba(94,242,208,0)');
        ctx.fillStyle = g0;
        ctx.beginPath(); ctx.arc(CX, CY, 210, 0, Math.PI * 2); ctx.fill();
      }


      /* 原点冲击环：台词出现的瞬间给一记 */
      for (let k = 0; k < 3; k++) {
        const uu = (age - k * 0.055) / 0.52;
        if (uu <= 0 || uu >= 1) continue;
        const rr0 = 18 + uu * 560;
        ctx.beginPath(); ctx.arc(CX, CY, rr0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(234,254,255,' + ((1 - uu) * (1 - uu) * 0.85).toFixed(3) + ')';
        ctx.lineWidth = 1 + 7 * (1 - uu);
        ctx.stroke();
      }


      const sxA = [], syA = [], szA = [], scA = [], lvA = [];
      for (let i = 0; i < n; i++) {
        if (bstep[i] > s0) { sxA[i] = null; continue; }
        born++;
        const b0 = (i * STEPS + s0) * 3;
        const b1 = (i * STEPS + s1) * 3;
        const x0 = pos[b0] + (pos[b1] - pos[b0]) * frc;
        const y0 = pos[b0 + 1] + (pos[b1 + 1] - pos[b0 + 1]) * frc;
        const z0 = pos[b0 + 2] + (pos[b1 + 2] - pos[b0 + 2]) * frc;

        const rx = x0 * ca - z0 * sa;
        const rz = x0 * sa + z0 * ca;
        const zc = Math.max(-F * 0.55, rz);
        const pr = F / (F + zc) * breathe;

        sxA[i] = CX + rx * pr * MS;
        syA[i] = CY + y0 * pr * MS;
        szA[i] = rz;
        scA[i] = pr;
        lvA[i] = nodes[i].level;
      }

      /* 枝干：父 → 子，越深越暗，越长越淡 */
      for (let i = 1; i < n; i++) {
        if (sxA[i] === null) continue;
        const p = nodes[i].parent;
        if (p < 0 || sxA[p] === null) continue;
        const d = clamp(1.15 - szA[i] / 1500, 0.20, 1);
        const len = Math.hypot(sxA[i] - sxA[p], syA[i] - syA[p]);
        const fade = clamp(1 - len / 820, 0.16, 1);
        ctx.strokeStyle = 'rgba(94,242,208,' +
          (0.34 * d * (1 - lvA[i] * 0.12) * on * fade).toFixed(3) + ')';
        ctx.lineWidth = clamp(1.6 - szA[i] / 900, 0.6, 2.2);
        ctx.beginPath();
        ctx.moveTo(sxA[p], syA[p]);
        ctx.lineTo(sxA[i], syA[i]);
        ctx.stroke();
      }

      /* 节点：远 → 近 排序后画，近的压住远的 */
      const order = [];
      for (let i = 0; i < n; i++) if (sxA[i] !== null) order.push(i);
      order.sort(function (a, b) { return szA[b] - szA[a]; });

      const COL = ['#eafeff', '#5ef2d0', '#4f7fff', '#a06bff', '#ff2f6d'];

      for (let q = 0; q < order.length; q++) {
        const i = order[q];
        const lv = lvA[i];
        const d = clamp(1.15 - szA[i] / 1500, 0.25, 1);
        const rr = Math.max(1.1, (3.5 - lv * 0.42) * scA[i]);

        /* 速度拖尾：往前几帧的位置拉一条很淡的线 */
        const sp0 = Math.max(0, s0 - 5);
        if (sp0 < s0) {
          const b0 = (i * STEPS + s0) * 3;
          const bt = (i * STEPS + sp0) * 3;
          const tx0 = pos[bt], ty0 = pos[bt + 1], tz0 = pos[bt + 2];
          const rx0 = tx0 * ca - tz0 * sa, rz0 = tx0 * sa + tz0 * ca;
          const pr0 = F / (F + Math.max(-F * 0.55, rz0)) * breathe;
          ctx.strokeStyle = 'rgba(94,242,208,' + (0.16 * d * on).toFixed(3) + ')';
          ctx.lineWidth = Math.max(1, rr * 0.55);
          ctx.beginPath();
          ctx.moveTo(CX + rx0 * pr0 * MS, CY + ty0 * pr0 * MS);
          ctx.lineTo(sxA[i], syA[i]);
          ctx.stroke();
        }

        if (lv <= 1) {
          const g = ctx.createRadialGradient(sxA[i], syA[i], 0, sxA[i], syA[i], rr * 5);
          g.addColorStop(0, rgba(COL[lv], 0.42 * d * on));
          g.addColorStop(1, rgba(COL[lv], 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(sxA[i], syA[i], rr * 5, 0, Math.PI * 2); ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(sxA[i], syA[i], rr, 0, Math.PI * 2);
        ctx.fillStyle = rgba(COL[lv], clamp(0.35 + 0.6 * d, 0, 1) * on);
        ctx.fill();
      }

      /* 子节点最多的那个点：挂参数读数 */
      let best = -1, bestK = -1;
      for (let i = 0; i < n; i++) {
        if (sxA[i] === null) continue;
        if (nodes[i].kids > bestK) { bestK = nodes[i].kids; best = i; }
      }
      if (best >= 0 && bestK > 0) {
        const bx = sxA[best], by = syA[best];
        const rot = t * 1.7;
        ctx.strokeStyle = 'rgba(234,254,255,0.78)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(bx, by, 15 + Math.sin(t * 4.1) * 2, rot, rot + Math.PI * 1.45);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(bx, by, 22, -rot, -rot + Math.PI * 0.55);
        ctx.stroke();

        const v1 = 0.5 + 0.5 * Math.sin(t * 2.7 + 0.4);
        const v2 = 0.5 + 0.5 * Math.cos(t * 1.9 + 1.1);
        const v3 = 0.5 + 0.5 * Math.sin(t * 0.7 + 2.2);
        const tx = bx + 46, ty = by - 48;
        ctx.strokeStyle = 'rgba(140,215,235,0.32)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + 9, by - 5);
        ctx.lineTo(tx - 5, ty + 4);
        ctx.stroke();

        mono(ctx, 12, '');
        ctx.fillStyle = 'rgba(234,254,255,0.82)';
        ctx.fillText(
          'n' + (best < 100 ? '0' : '') + (best < 10 ? '0' : '') + best +
          ' · branch ×' + bestK + ' · ω ' + v1.toFixed(3) +
          ' · φ ' + v2.toFixed(2) + ' · σ ' + v3.toFixed(3),
          tx, ty
        );
      }
    }

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.45)';
    ctx.fillText('SIMULATION · ' + Math.round(grow * 100) + '% · NODES ' + born + ' · 1920x1080', 96, horizon - 40);
  };


  /* ── S06 标题砸落（被调用）─────────────────────────────────────────────── */
  /* ── S06 标题段：绿色 01 瀑布 + 心电图 + 傅里叶分解 ──────────────────────── */
  const ECG_FLOW = [
    { a: 0.520, k: 1 }, { a: 0.430, k: 2 }, { a: 0.360, k: 3 }, { a: 0.300, k: 5 },
    { a: 0.250, k: 8 }, { a: 0.210, k: 13 }, { a: 0.175, k: 21 }, { a: 0.145, k: 34 }
  ];
  const ECG_T0 = 16.0, ECG_BEAT = 0.92, ECG_PEAK = 0.32, ECG_NORM = 2.390;

  const ecgTerm = function (i, u) {
    const h = ECG_FLOW[i];
    const ph = Math.PI / 2 - Math.PI * 2 * h.k * ECG_PEAK;
    return h.a * Math.sin(Math.PI * 2 * h.k * u + ph);
  };

  const ecgSum = function (u) {
    let s = 0;
    for (let i = 0; i < ECG_FLOW.length; i++) s += ecgTerm(i, u);
    return s / ECG_NORM;
  };

  /* 显示用的增益压缩：把等电位段压平，只留 QRS 尖峰 */
  const ecgShow = function (u) {
    const s = ecgSum(u);
    return (s < 0 ? -1 : 1) * Math.pow(Math.abs(s), 2.3);
  };

  /* 背景：绿色 01 瀑布流（每一格随时间翻面，纯 t） */
  const drawBinaryRain = function (ctx, t) {
    const W = CFG.W, H = CFG.H;
    const COLS = 64, cw = W / COLS, rh = 28;
    mono(ctx, 15, '');
    ctx.textAlign = 'center';
    for (let c = 0; c < COLS; c++) {
      const sp = 240 + hash01(c * 3.1 + 1.7) * 430;
      const off = hash01(c * 7.7 + 4.1) * 900;
      const head = ((t * sp + off) % (H + 460)) - 230;
      const L = 7 + Math.floor(hash01(c * 5.3 + 2.9) * 9);
      const flip = 5 + hash01(c * 2.1) * 7;
      for (let j = 0; j < L; j++) {
        const y = head - j * rh;
        if (y < -20 || y > H + 20) continue;
        const bit = (Math.floor(t * flip) + j + c) & 1;
        const a = j === 0 ? 0.55 : 0.28 * (1 - j / L);
        ctx.fillStyle = 'rgba(70,240,150,' + a.toFixed(3) + ')';
        ctx.fillText(bit ? '1' : '0', c * cw + cw / 2, y);
      }
    }
    ctx.textAlign = 'left';
  };

  MODULES['sc.titleDrop'] = function (ctx, t, localT, cfg) {
    const W = CFG.W;
    const H = CFG.H;
    const st = cfg.state;

    stage(ctx, t, st);

    const v = cfg.variant | 0;
    const title = 'world.execute(me);';

    /* ── 心跳：相位、脉冲、逐元素抖动 ── */
    const uu = (((t - ECG_T0) / ECG_BEAT) % 1 + 1) % 1;
    const beat = Math.exp(-Math.pow((uu - ECG_PEAK) / 0.052, 2));
    const jit = function (i) {
      return {
        x: (hash01(i * 3.7 + 0.5) - 0.5) * 18 * beat,
        y: (hash01(i * 7.1 + 2.3) - 0.5) * 18 * beat
      };
    };

    drawBinaryRain(ctx, t);

    /* ── 上方心电图 ── */
    const ex0 = 200, ex1 = 1720, ecy = 196, eamp = 54;
    const eSpan = 2.15;                       /* 屏上露出 2.15 个心动周期 */
    const nowU = (t - ECG_T0) / ECG_BEAT;
    const ej = jit(3);

    ctx.save();
    ctx.translate(ej.x, ej.y);

    /* 基线 + 网格 */
    ctx.strokeStyle = 'rgba(94,242,208,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ex0, ecy); ctx.lineTo(ex1, ecy); ctx.stroke();
    for (let g = 0; g <= 16; g++) {
      const gx = ex0 + (ex1 - ex0) * (g / 16);
      ctx.strokeStyle = 'rgba(94,242,208,0.055)';
      ctx.beginPath(); ctx.moveTo(gx, ecy - 74); ctx.lineTo(gx, ecy + 74); ctx.stroke();
    }

    /* 波形：右端是"现在"，往左是历史 */
    ctx.beginPath();
    const SAMPLES = 460;
    for (let s = 0; s <= SAMPLES; s++) {
      const f = s / SAMPLES;
      const x = ex0 + (ex1 - ex0) * f;
      const u = nowU - (1 - f) * eSpan;
      const val = ecgShow(((u % 1) + 1) % 1);
      const y = ecy - val * eamp;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(70,240,150,0.80)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 笔头 */
    const headY = ecy - ecgShow(((nowU % 1) + 1) % 1) * eamp;
    ctx.beginPath();
    ctx.arc(ex1, headY, 3.4 + beat * 3.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,255,220,' + (0.65 + 0.35 * beat).toFixed(3) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(70,240,150,' + (0.18 + 0.5 * beat).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ex1, ecy - 80); ctx.lineTo(ex1, ecy + 80); ctx.stroke();

    mono(ctx, 12, '');
    ctx.fillStyle = 'rgba(140,215,235,0.42)';
    ctx.fillText('ECG(me) · ' + ECG_BEAT.toFixed(2) + ' s / beat · lead II', ex0, ecy - 92);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(70,240,150,' + (0.30 + 0.5 * beat).toFixed(3) + ')';
    ctx.fillText('bpm ' + Math.round(60 / ECG_BEAT), ex1, ecy - 92);
    ctx.textAlign = 'left';
    ctx.restore();

    /* ── 下方：傅里叶基底，逐个出现（先左→右，再上→下） ── */
    const GW = 360, GH = 118, GX = 204, GY = 636, GAPX = 24, GAPY = 16;
    const merge = smooth(25.4, 27.0, t);
    const PANEL_T0 = 19.95, PANEL_STEP = 0.62;

    for (let i = 0; i < ECG_FLOW.length; i++) {
      const col = i % 4, row = (i / 4) | 0;
      const bx = GX + col * (GW + GAPX);
      const by = GY + row * (GH + GAPY);
      const ap = smooth(PANEL_T0 + i * PANEL_STEP, PANEL_T0 + i * PANEL_STEP + 0.45, t);
      if (ap < 0.004) continue;

      const toX = (W / 2 - (bx + GW / 2)) * 0.86 * merge;

      ctx.globalAlpha = ap * (1 - 0.92 * merge);

      ctx.scale(sc, sc);
      ctx.translate(-GW / 2, -GH / 2);

      /* 边框 */
      ctx.strokeStyle = 'rgba(94,242,208,0.22)';
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, GW - 1, GH - 1);
      ctx.fillStyle = 'rgba(94,242,208,0.035)';
      ctx.fillRect(1, 1, GW - 2, GH - 2);

      /* 参数：左上角 */
      const h = ECG_FLOW[i];
      const ph = (Math.PI / 2 - Math.PI * 2 * h.k * ECG_PEAK);
      const phNorm = ((ph / (Math.PI * 2)) % 1 + 1) % 1;
      mono(ctx, 11, '');
      ctx.fillStyle = 'rgba(234,254,255,0.72)';
      ctx.fillText('b' + (i + 1), 10, 18);
      ctx.fillStyle = 'rgba(140,215,235,0.55)';
      ctx.fillText('A ' + h.a.toFixed(3) + '   ω ' + h.k.toFixed(0) + '   φ ' +
        phNorm.toFixed(2) + 'π', 40, 18);

      /* 这一项的波形 */
      const iy = GH * 0.62;
      ctx.beginPath();
      const PS = 40 + h.k * 12;
      for (let s = 0; s <= PS; s++) {
        const f = s / PS;
        const x = 12 + (GW - 24) * f;
        const yy = iy - Math.sin(Math.PI * 2 * h.k * f + ph) * (GH * 0.26);
        if (s === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.strokeStyle = i === 0 ? 'rgba(234,254,255,0.85)' : 'rgba(94,242,208,0.70)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      ctx.restore();

      const cj = jit(11);
      ctx.save();
      ctx.globalAlpha = merge;
      ctx.translate(cj.x, cj.y);

      ctx.strokeStyle = 'rgba(94,242,208,0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx0, cyy); ctx.lineTo(cx1, cyy); ctx.stroke();

      ctx.beginPath();
      const N2 = 520;
      for (let s = 0; s <= N2; s++) {
        const f = s / N2;
        const x = cx0 + (cx1 - cx0) * f;
        const u = nowU - (1 - f) * 3.2;
        const y = cyy - ecgShow(((u % 1) + 1) % 1) * camp;
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(234,254,255,0.92)';
      ctx.lineWidth = 2.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx1, cyy - ecgShow(((nowU % 1) + 1) % 1) * camp, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(234,254,255,0.9)';
      ctx.fill();

      mono(ctx, 12, '');
      ctx.fillStyle = 'rgba(94,242,208,0.55)';
      ctx.fillText('Σ b1…b8  =  ECG(me)', cx0, cyy - 62);
      ctx.restore();
    }

    /* ── 标题 ── */
    let size = 132;
    mono(ctx, size, 'bold');
    let wid = ctx.measureText(title).width;
    if (wid > W - 320) {
      size = Math.floor(size * (W - 320) / wid);
      mono(ctx, size, 'bold');
      wid = ctx.measureText(title).width;
    }

    const slam = v === 0 ? clamp(localT / 0.55, 0, 1) : 1;
    const drop = 1 - Math.pow(1 - slam, 3);
    const over = v === 0 ? Math.sin(Math.min(localT, 0.9) / 0.9 * Math.PI) * 0.03 : 0;
    const tj = jit(5);
    const cx = W / 2 + tj.x, cy = 470 + (1 - drop) * -300 + tj.y;

    const paint = function (dx) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,47,109,0.55)';
      ctx.fillText(title, dx - 4 - st.glitch * 10, 2);
      ctx.fillStyle = 'rgba(94,242,208,0.55)';
      ctx.fillText(title, dx + 4 + st.glitch * 10, -2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(234,254,255,0.96)';
      ctx.fillText(title, dx, 0);
    };

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1 + over, 1 + over);
    ctx.textAlign = 'center';

    for (let i = 0; i < cfg.events.length; i++) {
      const e = cfg.events[i];
      if (e.type !== 'flash') continue;
      if (e.age < 0 || e.age > 1.3) continue;
      ctx.beginPath();
      ctx.arc(0, 0, 90 + e.age * 900, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(234,254,255,' + ((1 - e.age / 1.3) * 0.45).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    if (v === 2 || v === 4) {
      const sep = v === 2
        ? 26 + 128 * smooth(0, 1.5, localT)
        : 152 * (1 - smooth(0, 1.05, localT));
      const half = wid / 2 + 24;
      ctx.save();
      ctx.beginPath();
      ctx.rect(-half - sep, -size * 1.1, half, size * 2.2);
      ctx.clip();
      paint(-sep);
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.rect(sep, -size * 1.1, half, size * 2.2);
      ctx.clip();
      paint(sep);
      ctx.restore();
      const seam = clamp(sep / 55, 0, 1);
      ctx.fillStyle = 'rgba(5,7,14,' + (0.85 * seam).toFixed(3) + ')';
      ctx.fillRect(-sep - 3, -size * 0.62, 6, size * 1.24);
      ctx.fillRect(sep - 3, -size * 0.62, 6, size * 1.24);
      const glow = ctx.createLinearGradient(-sep, 0, sep, 0);
      glow.addColorStop(0, 'rgba(94,242,208,0)');
      glow.addColorStop(0.5, 'rgba(94,242,208,' + (0.18 * seam).toFixed(3) + ')');
      glow.addColorStop(1, 'rgba(94,242,208,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(-sep, -size * 0.55, sep * 2, size * 1.1);
    } else {
      paint(0);
    }

    if (st.glitch > 0.01) {
      const n = 4;
      const bh = size * 0.42;
      for (let i = 0; i < n; i++) {
        const dy0 = -size * 0.55 + i * bh;
        const dx = (hash01(Math.floor(t * CFG.FPS) * 1.7 + i * 5.1) - 0.5) * 70 * st.glitch;
        ctx.save();
        ctx.beginPath();
        ctx.rect(-wid, dy0, wid * 2, bh * 0.55);
        ctx.clip();
        ctx.fillStyle = 'rgba(234,254,255,0.92)';
        ctx.fillText(title, dx, 0);
        ctx.restore();
      }
    }

    if (v === 1) {
      for (let i = 0; i < 3; i++) {
        const yy = -size * 0.5 + i * size * 0.36;
        const dx = (hash01(Math.floor(t * 8) * 3.3 + i * 11.7) - 0.5) * 190;
        ctx.save();
        ctx.beginPath();
        ctx.rect(-wid, yy, wid * 2, size * 0.2);
        ctx.clip();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,47,109,0.32)';
        ctx.fillText(title, dx - 12, 0);
        ctx.fillStyle = 'rgba(94,242,208,0.32)';
        ctx.fillText(title, dx + 12, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(234,254,255,0.90)';
        ctx.fillText(title, dx, 0);
        ctx.restore();
      }
    }

    ctx.restore();

    if (v === 3) {
      const cols = 30;
      const x0 = W / 2 - wid / 2, x1 = W / 2 + wid / 2;
      const top = cy - size * 0.72, bot = cy + size * 0.78;
      mono(ctx, 13, '');
      ctx.textAlign = 'center';
      for (let i = 0; i < cols; i++) {
        const x = x0 + (i + 0.5) / cols * (x1 - x0);
        const sp = 320 + hash01(i * 4.7) * 460;
        const ph = (t * sp / 260 + hash01(i * 9.1) * 3) % 1;
        const head = top + ph * ((bot - top) + 280);
        for (let j = 0; j < 14; j++) {
          const yy = head - j * 15;
          if (yy < top - 20 || yy > bot + 20) continue;
          const ch = '01'[(i + j) & 1];
          const a = j === 0 ? 0.9 : 0.42 * (1 - j / 14);
          ctx.fillStyle = 'rgba(70,240,150,' + a.toFixed(3) + ')';
          ctx.fillText(ch, x, yy);
        }
      }
      ctx.textAlign = 'left';
    }

    /* 基线与注释 */
    const baseY = 470 + (1 - drop) * -300 + size * 0.55 + tj.y;
    ctx.strokeStyle = 'rgba(234,254,255,' + (0.10 + 0.25 * drop).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - wid / 2, baseY);
    ctx.lineTo(W / 2 + wid / 2, baseY);
    ctx.stroke();

    mono(ctx, 20, '');
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(140,215,235,' + (0.30 + 0.25 * drop).toFixed(3) + ')';
    const sub = ['// call #001  ·  pure function of t',
                 '// tearing  ·  rgb split  ·  no repair',
                 '// a change of basis  ·  the sum is still me',
                 '// overwritten by output  ·  01001101',
                 '// reassemble  ·  ready to execute'][v] || '// call #001';
    ctx.fillText(sub, W / 2, baseY + 46);
    ctx.textAlign = 'left';
  };

  /* ── S07 点集：先逐点亮起，再炸开成六组 2D/3D 图形，各自朝不同方向散开 ──── */
  const PT_BURST_AT = 0.90;   /* 炸开点：本镜起点后 0.90s（比 DIMENSION 早 1.78s）*/
  const PT_GROUPS = [
    { n: 8,  x: -700, y: -170, k: 2, spin:  0.55, span: 158, delay: 0.00, dur: 2.30 },
    { n: 10, x: -470, y:  150, k: 2, spin: -0.74, span: 152, delay: 0.12, dur: 2.05 },
    { n: 12, x: -230, y: -120, k: 2, spin:  0.96, span: 134, delay: 0.06, dur: 2.55 },
    { n: 8,  x:  250, y:  160, k: 3, spin:  0.78, span: 132, delay: 0.18, dur: 2.20 },
    { n: 12, x:  520, y: -150, k: 3, spin: -0.52, span: 138, delay: 0.02, dur: 2.60 },
    { n: 14, x:  730, y:   90, k: 3, spin:  0.66, span: 150, delay: 0.10, dur: 1.95 }
  ];
  const PT_PNAMES = ['ω', 'φ', 'σ', 'λ', 'θ', 'dim', 'b', 'n'];

  MODULES['sc.pointCloud'] = function (ctx, t, localT, cfg) {
    const W = CFG.W, H = CFG.H;
    const st = cfg.state;
    stage(ctx, t, st);

    const N = 64;
    const cx = W / 2, cy = 470;
    const lineY = 540, x0 = 250, x1 = 1670;

    const age = localT - PT_BURST_AT;

    /* 三段：炸散（0–0.9）→ 各自飘（0.9–1.4）→ 成形（1.4–2.6）*/
    const bangRamp = age > 0 ? smooth(0, 0.20, age) : 0;
    const bang   = age > 0 ? Math.pow(bangRamp, 0.7) * Math.exp(-1.55 * Math.max(0, age - 0.20)) : 0;
    const grow   = age > 0 ? smooth(0.85, 2.30, age) : 0;        /* 向图形收拢 */
    const kick   = age > 0 ? Math.pow(bangRamp, 0.7) * Math.exp(-4.2 * age) : 0;
    const edgeA  = clamp((1 - smooth(0.02, 0.13, age)) + smooth(1.25, 2.05, age), 0, 1);
    const axisA  = age > 0 ? Math.max(0, 1 - smooth(0.0, 0.45, age)) : 1;

    /* ── 背景：淡淡的跳动参数 ── */
    mono(ctx, 12, '');
    for (let k = 0; k < 16; k++) {
      const hx = hash01(k * 7.13 + 2.1), hy = hash01(k * 3.77 + 5.9);
      const qx = 90 + hx * (W - 180);
      const qy = 150 + hy * (H - 430);
      const v = 0.5 + 0.5 * Math.sin(t * (0.55 + hash01(k * 1.7) * 0.95) + k * 1.31);
      const nm = PT_PNAMES[k % PT_PNAMES.length];
      ctx.fillStyle = 'rgba(150,220,240,' + (0.09 + 0.11 * v).toFixed(3) + ')';
      ctx.fillText(nm + ' ' + (v * 2.4).toFixed(3), qx, qy);
    }

    const px = [], py = [], pz = [], pgrp = [], papp = [];

    let g = 0, gi = 0;
    for (let i = 0; i < N; i++) {
      while (g < PT_GROUPS.length - 1 && gi >= PT_GROUPS[g].n) { g++; gi = 0; }
      const G = PT_GROUPS[g];
      const u = gi / G.n;

      /* 入场：沿数轴一个个亮起来 */
      const tIn = 0.05 + (i / (N - 1)) * 0.62;
      const ap = clamp((localT - tIn) / 0.20, 0, 1);

      /* 各组自己的散开节奏：延迟不同、时长不同、缓出 */
      const go = age > 0 ? clamp((age - G.delay) / G.dur, 0, 1) : 0;
      const ge = 1 - Math.pow(1 - go, 3);

      let sx = 0, sy = 0, sz = 0;

      if (g === 0) {
        const s = u * 4, side = Math.floor(s) % 4, f = s - Math.floor(s);
        const h2 = G.span * 0.5;
        const cor = [[-h2, -h2], [h2, -h2], [h2, h2], [-h2, h2]];
        const a0 = cor[side], a1 = cor[(side + 1) % 4];
        sx = a0[0] + (a1[0] - a0[0]) * f;
        sy = a0[1] + (a1[1] - a0[1]) * f;
      } else if (g === 1) {
        const ang = u * Math.PI * 2 - Math.PI / 2;
        const rr = (gi % 2 === 0) ? G.span : G.span * 0.40;
        sx = Math.cos(ang) * rr;
        sy = Math.sin(ang) * rr;
      } else if (g === 2) {
        const ang = u * Math.PI * 2;
        sx = Math.cos(ang) * G.span;
        sy = Math.sin(ang) * G.span;
      } else if (g === 3) {
        const h3 = G.span * 0.5;
        sx = ((gi & 1) ? h3 : -h3);
        sy = ((gi & 2) ? h3 : -h3);
        sz = ((gi & 4) ? h3 : -h3);
      } else if (g === 4) {
        if (gi < 6) {
          const ax = gi % 3, sg = (gi % 2 === 0) ? 1 : -1;
          sx = ax === 0 ? G.span * sg : 0;
          sy = ax === 1 ? G.span * sg : 0;
          sz = ax === 2 ? G.span * sg : 0;
        } else {
          const ang = ((gi - 6) / 6) * Math.PI * 2;
          sx = Math.cos(ang) * G.span * 0.82;
          sy = 0;
          sz = Math.sin(ang) * G.span * 0.82;
        }
      } else {
        const gy2 = 1 - ((gi + 0.5) / G.n) * 2;
        const gr = Math.sqrt(Math.max(0, 1 - gy2 * gy2));
        const ga = gi * 2.399963;
        sx = Math.cos(ga) * gr * G.span;
        sy = gy2 * G.span;
        sz = Math.sin(ga) * gr * G.span;
      }

      let rx = sx, ry = sy, rz = sz;
      if (G.k === 2) {
        const a2 = t * G.spin;
        const ca2 = Math.cos(a2), sa2 = Math.sin(a2);
        rx = sx * ca2 - sy * sa2;
        ry = sx * sa2 + sy * ca2;
      } else {
        const ay1 = t * G.spin, ax1 = t * G.spin * 0.63;
        const cy1 = Math.cos(ay1), sy1 = Math.sin(ay1);
        const cx1 = Math.cos(ax1), sx1 = Math.sin(ax1);
        const x1p = sx * cy1 + sz * sy1;
        const z1p = -sx * sy1 + sz * cy1;
        const y1p = sy * cx1 - z1p * sx1;
        const z2p = sy * sx1 + z1p * cx1;
        const pf = 900 / (900 + z2p);
        rx = x1p * pf;
        ry = y1p * pf;
        rz = z2p;
      }

      const tx = cx + G.x * ge + rx;
      const ty = cy + G.y * ge + ry;

      const ax0 = x0 + (i / (N - 1)) * (x1 - x0);
      const ay0 = lineY + Math.sin(i * 1.7) * 2;
      const ex = tx - ax0, ey = ty - ay0;
      const dl = Math.sqrt(ex * ex + ey * ey) || 1;

      /* 每点自己的炸散方向与距离 —— 离散，不是整片平移 */
      const bangA = hash01(i * 7.31 + 1.7) * Math.PI * 2;
      const bangR = (110 + hash01(i * 3.19 + 0.9) * 210) * bang;
      const lift = (1 - hash01(i * 5.53 + 4.4)) * 60 * bang;

      px[i] = ax0 + ex * grow + Math.cos(bangA) * bangR + (ex / dl) * kick * 90;
      py[i] = ay0 + ey * grow + Math.sin(bangA) * bangR * 0.72 - lift + (ey / dl) * kick * 90;
      pz[i] = rz;
      pgrp[i] = G.k;
      papp[i] = ap;
      gi++;
    }

    /* ── 数轴 ── */
    if (axisA > 0.01) {
      ctx.strokeStyle = 'rgba(94,242,208,' + (0.30 * axisA).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0 - 70, lineY); ctx.lineTo(x1 + 70, lineY); ctx.stroke();
      for (let i = 0; i <= 10; i++) {
        const gx = x0 - 70 + (x1 - x0 + 140) * (i / 10);
        ctx.beginPath();
        ctx.moveTo(gx, lineY - 7); ctx.lineTo(gx, lineY + 7);
        ctx.stroke();
      }
    }

        ctx.lineWidth = 1;
        ctx.stroke();
      }

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(150,220,240,0.55)';
    ctx.fillText('DIMENSION  ·  2D × 3 + 3D × 3  ·  n = ' + N + '  ·  links by distance', 96, 236);

  /* ── S08 圆周：画满 → 展开成弧 → 变直线，半径失效 ────────────────────── */
  MODULES['sc.circleArc'] = function (ctx, t, localT, cfg) {
    const W = CFG.W;
    const st = cfg.state;
    stage(ctx, t, st);

    const R0 = 215, cx = W / 2, cy = 470;
    const LEN = Math.PI * 2 * R0;          /* 弧长守恒：L = 2πR₀ */
    const T_UNROLL = 1.29;                 /* 圆周画满的时刻 */
    const T_BREAK = 2.87;                  /* 曲率归零（正好压在 CIRCUMFERENCE 上）*/

    /* 画满的过程 */
    const p = clamp(localT / T_UNROLL, 0, 1);

    /* 展开：R 增大 → 曲率减小；用 1/(1-u)^2.5 保证末段迅速拉直 */
    const uu = clamp((localT - T_UNROLL) / 2.11, 0, 1);
    const R = uu >= 1 ? 1e7 : R0 / Math.pow(1 - uu, 2.5);
    const half = LEN / (2 * R);            /* 半张角 */
    const broken = half < 0.105;

    /* 弧上取样：s ∈ [-L/2, L/2] 的弧长坐标 */
    const at = function (s) {
      const phi = s / R;
      return [cx + R * Math.sin(phi), cy + R * (1 - Math.cos(phi))];
    };

    /* 原始圆：虚线参照，展开后淡出 */
    if (uu > 0.01) {
      ctx.setLineDash([4, 10]);
      ctx.strokeStyle = 'rgba(94,242,208,' + (0.14 * (1 - uu)).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy + R0, R0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    /* 弧 / 线本体 */
    ctx.strokeStyle = broken ? 'rgba(255,242,246,0.95)' : 'rgba(94,242,208,0.92)';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    if (p < 1) {
      /* 还在画圆：从顶点顺时针扫 */
      ctx.arc(cx, cy + R0, R0, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2);

      const step = Math.max(4, LEN / 220);

        const q = at(Math.min(s, LEN / 2));
        if (s <= -LEN / 2 + 0.001) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
      }
    }
    ctx.stroke();

    if (p >= 1) {
      /* 弦：两端的连线 */
      const a1 = at(-LEN / 2), a2 = at(LEN / 2);
      ctx.setLineDash([5, 7]);
      ctx.strokeStyle = 'rgba(234,254,255,0.42)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.stroke();
      ctx.setLineDash([]);

      /* 两端标记 */
      for (const q of [a1, a2]) {
        ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(234,254,255,0.9)'; ctx.fill();

      /* 曲率半径指示（R 还小的时候才画得下） */
      if (R < 1100) {
        const apex = at(0);
        ctx.strokeStyle = 'rgba(94,242,208,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(apex[0], apex[1]);
        ctx.lineTo(cx, cy + R);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy + R, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(94,242,208,0.7)'; ctx.fill();
        mono(ctx, 14, '');
        ctx.fillStyle = 'rgba(94,242,208,0.55)';
        ctx.fillText('R', cx + 8, cy + R - 8);
      }
    }

    /* 曲率归零那一下的冲击 */
    const bt = localT - T_BREAK;
    if (bt >= 0 && bt < 0.55) {
      const q = bt / 0.55;
      ctx.strokeStyle = 'rgba(255,242,246,' + ((1 - q) * (1 - q) * 0.85).toFixed(3) + ')';
      ctx.lineWidth = 1 + 7 * (1 - q);

      lg.addColorStop(0.5, 'rgba(234,254,255,' + (0.55 * (1 - q)).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(234,254,255,0)');

    }

    /* ── 参数 ── */
    const chord = 2 * R * Math.sin(half);
    mono(ctx, 15, '');
    ctx.fillStyle = 'rgba(150,220,240,0.55)';
    ctx.fillText('CIRCUMFERENCE  ·  L = ' + LEN.toFixed(1) + '  ·  θ = ' + (half * 2).toFixed(3) + ' rad', 96, 232);

    ctx.fillStyle = 'rgba(150,220,240,0.42)';
    ctx.fillText('chord', 96, 268);
    ctx.fillText(chord.toFixed(1), 96, 292);

    ctx.fillStyle = 'rgba(150,220,240,0.42)';
    ctx.fillText('radius of curvature', 300, 268);
    if (broken) {
      ctx.fillStyle = 'rgba(255,47,109,0.95)';
      ctx.fillText('UNKNOWN ERROR', 300, 292);
      ctx.fillStyle = 'rgba(255,47,109,0.55)';
      ctx.fillText('R → ∞   κ → 0   the circle is no longer a circle', 300, 318);
    } else {
      ctx.fillStyle = 'rgba(234,254,255,0.78)';
      ctx.fillText(R.toFixed(1), 300, 292);
    }
  };

      const u = hash01(i * 3.9 + 1.3);
      const v = hash01(i * 7.1 + 4.7);
      const px = cx - halfW + halfW * 2 * ((u + t * 0.012) % 1);

      ctx.fillStyle = 'rgba(200,190,255,' + (0.10 + 0.10 * close).toFixed(3) + ')';
      ctx.fillRect(px, py, 1.6, 1.6);

    ctx.restore();

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.48)';
    ctx.fillText('SIMULATION  ·  ' + Math.round(close * 100) + '% closed', cx - halfW, cy - halfH - 18);

    ctx.fillStyle = 'rgba(255,47,109,' + (0.45 + 0.35 * close).toFixed(3) + ')';

  /* ── S19 茄子 · 营养成分键线式（科幻标本扫描）────────────────────────── */
  MODULES['sc.bioEggplant'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;

    const appear = smooth(0.05, 0.55, localT);
    const scanU = (localT * 0.42) % 1;

    const poly = function (pts, close, w, col) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {

      return [cx + side * widthAt(v) * (k === undefined ? 1 : k), y];

    ctx.globalAlpha = appear;
    const right = [], left = [];
    for (let i = 0; i <= 60; i++) {
      const v = i / 60;

    poly([[cx - 10, topY + 8], [cx - 6, topY - 34], [cx + 4, topY - 58], [cx + 12, topY - 34], [cx + 12, topY + 6]],
          false, 2.0, 'rgba(234,254,255,0.82)');
    for (let k = -2; k <= 2; k++) {
      poly([[cx + k * 26, topY + 18], [cx + k * 40, topY - 6], [cx + k * 18, topY + 2]],
            false, 1.2, 'rgba(94,242,208,0.62)');

    const wScan = widthAt(vScan) + 6;

    ctx.lineWidth = 1.6;

    ctx.lineTo(cx + wScan, scanY);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(140,215,235,0.34)';
    ctx.lineWidth = 1;

    ctx.moveTo(dx, cy - bodyH / 2); ctx.lineTo(dx, cy + bodyH / 2);

    ctx.moveTo(dx - 8, cy + bodyH / 2); ctx.lineTo(dx + 8, cy + bodyH / 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(94,242,208,0.16)';

    /* ---------- 键线式：绘图基元（局部单位 = 1 根键长） ---------- */
    const painter = function (mx, my, b, a) {
      const X = (u) => mx + u * b, Y = (v) => my + v * b;
      const seg = function (p, q, w, al) {
        ctx.beginPath();
        ctx.moveTo(X(p[0]), Y(p[1]));
        ctx.lineTo(X(q[0]), Y(q[1]));

        seg(p, q);
        const x1 = X(p[0]), y1 = Y(p[1]), x2 = X(q[0]), y2 = Y(q[1]);
        const vx = x2 - x1, vy = y2 - y1, L = Math.hypot(vx, vy) || 1;
        const nx = -vy / L * 3.3, ny = vx / L * 3.3;

        ctx.stroke();

        mono(ctx, size || 11, 700);
        ctx.fillStyle = 'rgba(94,242,208,' + (0.88 * a).toFixed(3) + ')';
        ctx.textAlign = align || 'center';
        ctx.fillText(s2, X(p[0]), Y(p[1]));
        ctx.textAlign = 'left';

      const atom = function (p, s2, size, rr) {

        ctx.fillStyle = 'rgba(94,242,208,' + (0.92 * a).toFixed(3) + ')';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s2, X(p[0]), Y(p[1]) + 0.5);

        ctx.textBaseline = 'alphabetic';
      };

    /* ---------- 维生素 C：L-抗坏血酸（呋喃-2-酮 + 2,3-烯二醇） ---------- */

      const X2 = function (u) { return mx + u * b; };

      /* 引线 + 文字标注 */
      const note = function (px, py, tx, ty, s2, align) {

        ctx.strokeStyle = 'rgba(94,242,208,' + (0.34 * a).toFixed(3) + ')';

        ctx.fillText(s2, X2(tx) + off, Y2(ty) + 3);
        ctx.textAlign = 'left';
      };

      /* 四个吡咯环：各有一个顶点朝向环心 */
      const RR = 0.94;
      const centres = [[0, -RR], [RR, 0], [0, RR], [-RR, 0]];
      const inners = [];
      for (let k = 0; k < 4; k++) {
        const c = centres[k];
        const base = Math.atan2(-c[1], -c[0]);
        const pts = [];
        for (let i = 0; i < 5; i++) {
          const ang = base + (i / 5) * Math.PI * 2;

      note(0.86, -0.60, 1.66, -1.30, '7 × CONH₂', 'center');
      note(0.72, 1.28, 1.05, 1.78, 'ribose · PO₄ → 5,6-Me₂-benzimidazole', 'center');
    };

    /* ---------- 面板 ---------- */
    const panel = function (mx, my, hw, hh, label, formula, fn, order, b) {
      const a = smooth(0.24 + order * 0.14, 0.66 + order * 0.14, localT);
      if (a <= 0.01) return;
      ctx.strokeStyle = 'rgba(94,242,208,' + (0.30 * a).toFixed(3) + ')';
      ctx.lineWidth = 1;
      const c = Math.min(hw, hh) * 0.34;
      ctx.beginPath();
