      for (let k = 0; k < 5; k++) {
        const ph = (uu * 1.35 + k * 0.2) % 1;
        const rr = 470 * (1 - ph) + 40;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(160,225,245,' + (0.16 * ph).toFixed(3) + ')';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2 + t * 0.55;
        const rr = 300 + 90 * Math.sin(t * 0.7 + i);
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.86, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(190,240,255,' + (0.35 + 0.3 * Math.sin(t * 2 + i)).toFixed(3) + ')';
        ctx.fill();
      }
    }

    /* ---------- 核心：冲击时暴涨再收 ---------- */
    const coreR = before
      ? 14 + 5 * Math.sin(t * 2.4)
      : Math.max(6, 300 * Math.pow(1 - boom, 3) + 10);
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(60, coreR * 3.2));
    glow.addColorStop(0, 'rgba(255,255,255,0.92)');
    glow.addColorStop(0.28, 'rgba(190,250,255,0.42)');
    glow.addColorStop(1, 'rgba(94,242,208,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(60, coreR * 3.2), 0, Math.PI * 2);
    ctx.fill();

    /* ---------- 冲击波：5 圈递进 + RGB 错位 ---------- */
    if (age > 0) {
      for (let k = 0; k < 5; k++) {
        const a2 = age - k * 0.075;
        if (a2 <= 0 || a2 > 2.2) continue;
        const u = clamp(a2 / 2.2, 0, 1);
        const e = 1 - Math.pow(1 - u, 2.4);
        const rr = 26 + e * (k === 0 ? 860 : 700 - k * 40);
        const al = (1 - u) * (0.62 - k * 0.09);
        ctx.strokeStyle = (k % 2 === 0 ? 'rgba(240,255,255,' : 'rgba(94,242,208,') + al.toFixed(3) + ')';
        ctx.lineWidth = (1 - u) * 8 + 0.6;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, Math.PI * 2);
        ctx.stroke();
        /* 错位重影，制造色散 */
        if (k < 2) {
          ctx.strokeStyle = 'rgba(255,60,140,' + (al * 0.30).toFixed(3) + ')';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(cx + 5 + k * 3, cy - 3, rr, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    /* ---------- 速度线：从核心甩出的短线 ---------- */
    const NS = 56;
    for (let i = 0; i < NS; i++) {
      const a = hash01(i * 2.13) * Math.PI * 2 + t * 0.05;
      const long = i % 3 === 0;
      const len0 = before ? 120 + 160 * hash01(i * 3.7) : 300 + 620 * Math.pow(1 - boom, 1.6) * (long ? 1 : 0.55);
      const r0 = before ? 30 : 20 + 260 * hash01(i * 5.1) * (1 - boom);
      const r1 = r0 + (before ? 60 : len0 * 0.55);
      const al = before ? 0.05 + 0.05 * hash01(i * 7.9)
                        : (1 - boom) * (long ? 0.55 : 0.28);
      ctx.strokeStyle = 'rgba(235,253,255,' + Math.max(0, al).toFixed(3) + ')';
      ctx.lineWidth = long ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }

    /* ---------- 碎片：炸开后缓慢外飘，带拖尾 ---------- */
    if (age > 0) {
      for (let i = 0; i < 96; i++) {
        const dir = hash01(i * 3.17) * Math.PI * 2;
        const sp = 260 + 900 * hash01(i * 8.41);
        const dr = 1.9 * (0.35 + 0.65 * Math.pow(1 - boom, 1.5));
        const rr = 26 + sp * Math.pow(after, 0.55);
        const x = cx + Math.cos(dir) * rr;
        const y = cy + Math.sin(dir) * rr;
        const al = (1 - after) * (0.55 + 0.4 * hash01(i * 9.13));
        if (al <= 0.01) continue;
        const col = i % 4 === 0 ? '94,242,208' : '234,254,255';
        ctx.strokeStyle = 'rgba(' + col + ',' + (al * 0.45).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - Math.cos(dir) * dr * 12, y - Math.sin(dir) * dr * 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, dr, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + col + ',' + al.toFixed(3) + ')';
        ctx.fill();
      }
    }

    /* ---------- 冲击后：雷达式扫描环 + 卫星点 + 呼吸光环 ---------- */
    if (!before) {
      const rOut = 380 + 60 * smooth(0, 3, localT - TW);
      /* 三层刻度环 */
      for (let k = 0; k < 3; k++) {
        const rr = rOut * (0.55 + 0.22 * k);
        ctx.beginPath();
        ctx.arc(cx, cy, rr, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(140,215,235,' + (0.10 + 0.05 * k).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
        const nt = 48 + k * 12;
        for (let i = 0; i < nt; i++) {
          const a = (i / nt) * Math.PI * 2 + t * (0.10 + 0.05 * k) * (k % 2 ? -1 : 1);
          const lg = i % 4 === 0;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
          ctx.lineTo(cx + Math.cos(a) * (rr + (lg ? 9 : 4)), cy + Math.sin(a) * (rr + (lg ? 9 : 4)));
          ctx.strokeStyle = 'rgba(150,225,245,' + (lg ? 0.22 : 0.10) + ')';
          ctx.stroke();
        }
      }
      /* 扫描扇面 */
      const swA = (localT * 1.15) % (Math.PI * 2);
      for (let i = 0; i < 26; i++) {
        const a0 = swA - i * 0.028;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a0) * rOut, cy + Math.sin(a0) * rOut);
        ctx.strokeStyle = 'rgba(120,245,215,' + (0.10 * (1 - i / 26)).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      /* 环上卫星点 */
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2 + localT * 0.42;
        const rr = rOut * 0.96;
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        ctx.beginPath();
        ctx.arc(x, y, 3.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(94,242,208,0.85)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(94,242,208,0.10)';
        ctx.fill();
      }
      /* 呼吸的外环 */
      const br = 1 + 0.02 * Math.sin(localT * 2.2);
      ctx.beginPath();
      ctx.arc(cx, cy, rOut * 1.12 * br, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(234,254,255,' + (0.10 + 0.05 * Math.sin(localT * 2.2)).toFixed(3) + ')';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    ctx.restore();

    /* ---------- 读数 ---------- */
    mono(ctx, 12, '');
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(140,215,235,0.60)';
    const pct = before ? Math.round(clamp(localT / TW, 0, 1) * 100) : 100;
    ctx.fillText('EXISTENCE  ·  requires proof  ·  ' + pct + '%', 96, 700);

    /* 边缘暗角随冲击加深 */
    const vg = ctx.createRadialGradient(cx, cy, 200, cx, cy, 1000);
    vg.addColorStop(0, 'rgba(5,7,14,0)');
    vg.addColorStop(1, 'rgba(5,7,14,' + (0.26 + 0.34 * (before ? 0 : (1 - boom))).toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  };

  MODULES['sc.glyphFM'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cx = W / 2, cy = 470;
    const sweep = Math.sin(localT * 1.7 - 0.5);      /* −1 → 1 */
    const seam = cx + sweep * 150;                   /* 缝只在字内摆动，两边始终都在 */

    const size = 420;
    mono(ctx, size, 'bold');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    /* 同一个位置上 F 与 M 各占一边：缝移动 = 字换性 */
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, seam, H); ctx.clip();
    ctx.fillStyle = 'rgba(94,242,208,0.92)';
    ctx.fillText('F', cx, cy);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.rect(seam, 0, W - seam, H); ctx.clip();
    ctx.fillStyle = 'rgba(255,47,109,0.92)';
    ctx.fillText('M', cx, cy);
    ctx.restore();

    ctx.textBaseline = 'alphabetic';

    /* 扫描线 */
    ctx.fillStyle = 'rgba(234,254,255,0.85)';
    ctx.fillRect(seam - 1, cy - 178, 2, 356);
    ctx.fillStyle = 'rgba(234,254,255,0.07)';
    ctx.fillRect(seam - 22, cy - 178, 44, 356);

    /* 上下刻度 */
    ctx.strokeStyle = 'rgba(234,254,255,0.20)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 40; i++) {
      const x = 96 + (i / 39) * (W - 192);
      const hh = i % 5 === 0 ? 14 : 7;
      ctx.beginPath();
      ctx.moveTo(x, cy + 292); ctx.lineTo(x, cy + 292 + hh);
      ctx.stroke();
    }

    /* 读数 */
    mono(ctx, 14, '');
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('GENDER SWITCH  ·  F | M  ·  split ' + (sweep >= 0 ? '+' : '') + Math.round(sweep * 100) + '%  ·  seam ' + Math.round(seam) + 'px', 96, cy + 348);

    /* 被切换的一侧标记 */
    mono(ctx, 13, '');
    ctx.fillStyle = 'rgba(94,242,208,0.72)';
    ctx.fillText('F', 96, cy - 330);
    ctx.fillStyle = 'rgba(255,47,109,0.72)';
    ctx.fillText('M', 118, cy - 330);
  };

  /* ── S24 钟与昼夜（AM / PM）────────────────────────────────────────────── */
  MODULES['sc.clockAMPM'] = function (ctx, t, localT, cfg) {
    const { W } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cx = W / 2, cy = 460, R = 205;
    const prog = clamp(localT / 3.45, 0, 1);
    const hours = prog * 13.5;                    /* 0 → 13.5 小时，正好跨过正午 */
    const hAng = (hours % 12) / 12 * Math.PI * 2 - Math.PI / 2;
    const mAng = (hours * 60 % 60) / 60 * Math.PI * 2 - Math.PI / 2;
    const pm = hours >= 12;

    /* 昼夜底盘：上半夜、下半昼，随小时旋转 */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();

    const dayAng = hAng + Math.PI / 2;
    ctx.save();
    ctx.rotate(dayAng);
    ctx.fillStyle = 'rgba(232,178,58,0.10)';
    ctx.fillRect(-R * 2, 0, R * 4, R * 2);
    ctx.fillStyle = 'rgba(90,110,190,0.14)';
    ctx.fillRect(-R * 2, -R * 2, R * 4, R * 2);
    ctx.restore();
    ctx.restore();

    /* 表盘 */
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(234,254,255,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 刻度 */
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const r0 = R - (i % 3 === 0 ? 26 : 14), r1 = R - 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.strokeStyle = i % 3 === 0 ? 'rgba(234,254,255,0.55)' : 'rgba(234,254,255,0.22)';
      ctx.lineWidth = i % 3 === 0 ? 2 : 1;
      ctx.stroke();
    }

    /* 指针 */
    const hand = function (a, len, wid, col) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
      ctx.strokeStyle = col;
      ctx.lineWidth = wid;
      ctx.lineCap = 'round';
      ctx.stroke();
    };
    hand(hAng, R * 0.52, 6, 'rgba(234,254,255,0.92)');
    hand(mAng, R * 0.78, 3, 'rgba(232,178,58,0.85)');
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(234,254,255,0.95)'; ctx.fill();

    /* 数字读数：AM / PM */
    const hh = Math.floor(hours) % 12 === 0 ? 12 : Math.floor(hours) % 12;
    const mm = Math.floor((hours * 60) % 60);
    mono(ctx, 56, 'bold');
    ctx.textAlign = 'center';
    ctx.fillStyle = pm ? 'rgba(232,178,58,0.95)' : 'rgba(94,242,208,0.95)';
    ctx.fillText((hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm) + '  ' + (pm ? 'PM' : 'AM'), cx, cy + R + 92);
    ctx.textAlign = 'left';

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('TIME OF DAY  ·  ' + (pm ? 'AFTER NOON' : 'BEFORE NOON') + '  ·  ' + (hours).toFixed(2) + ' h', 96, cy + R + 148);
  };

  /* ── S25 角色翻牌（S / M）──────────────────────────────────────────────── */
  MODULES['sc.glyphSM'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cols = 6, rows = 4;
    const cw = 152, ch = 118, gap = 12;
    const gw = cols * cw + (cols - 1) * gap;
    const gh = rows * ch + (rows - 1) * gap;
    const x0 = (W - gw) / 2, y0 = 250;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        const x = x0 + c * (cw + gap), y = y0 + r * (ch + gap);

        /* 每格有自己的翻牌时刻：沿对角线推进 */
        const ph = ((localT * 0.85 - (r + c) * 0.11) % 1 + 1) % 1;
        const flip = ph < 0.10 ? Math.abs(Math.cos(ph / 0.10 * Math.PI)) : 1;   /* 1 → 0 → 1 的压扁 */
        const face = ph < 0.55 ? 'S' : 'M';

        ctx.fillStyle = 'rgba(255,47,109,0.05)';
        ctx.fillRect(x, y, cw, ch);
        ctx.strokeStyle = 'rgba(255,47,109,0.22)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);

        ctx.save();
        ctx.translate(x + cw / 2, y + ch / 2);
        ctx.scale(1, Math.max(0.04, flip));
        mono(ctx, 96, 'bold');
        ctx.fillStyle = face === 'S' ? 'rgba(234,254,255,0.92)' : 'rgba(255,47,109,0.95)';
        ctx.fillText(face, 0, 4);
        ctx.restore();

        /* 翻牌瞬间的亮边 */
        if (flip < 0.6) {
          ctx.fillStyle = 'rgba(255,255,255,' + ((1 - flip) * 0.55).toFixed(3) + ')';
          ctx.fillRect(x, y + ch / 2 - 1, cw, 2);
        }
      }
    }

    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('ROLE BOARD  ·  ' + cols + '×' + rows + '  ·  switching  ·  ' + Math.round(clamp(localT / 3.9, 0, 1) * 100) + '%', 96, 724);
  };

  /* ── S26 万花筒（进入恍惚）────────────────────────────────────────────── */
  MODULES['sc.kaleido'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cx = W / 2, cy = 460;
    const N = 8;
    const R = 520;
    const spin = localT * 0.22 + t * 0.05;
    const open = smooth(0.05, 1.2, localT);

    ctx.save();
    ctx.translate(cx, cy);

    for (let i = 0; i < N; i++) {
      ctx.save();
      ctx.rotate(spin + (i / N) * Math.PI * 2);

      /* 只画一个扇形，其余靠旋转复制（镜像靠再画一次负角） */
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, -Math.PI / N, Math.PI / N);
      ctx.closePath();
      ctx.clip();

      const pulse = 0.5 + 0.5 * Math.sin(localT * 2.4 + i * 0.7);

      /* 花瓣：一片叶子沿楔形中轴，靠 8 次旋转长成万花筒 */
      const petal = function (scale, col, lw, fill) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(110 * scale, -64 * scale, 300 * scale, -72 * scale, 430 * scale, 0);
        ctx.bezierCurveTo(300 * scale, 72 * scale, 110 * scale, 64 * scale, 0, 0);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.stroke();
      };
      const gw2 = open * (0.86 + 0.14 * pulse);
      petal(gw2, 'rgba(160,107,255,0.55)', 2, 'rgba(160,107,255,0.05)');
      petal(gw2 * 0.56, 'rgba(94,242,208,0.32)', 1.2, null);
      petal(gw2 * 0.30, 'rgba(234,254,255,0.22)', 1, null);

      /* 放射线 */
      for (let j = 0; j < 3; j++) {
        const a = -Math.PI / N + (j / 2) * (Math.PI * 2 / N);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 40);
        ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
        ctx.strokeStyle = 'rgba(160,107,255,0.16)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      /* 顶点珠 */
      const pa = 0;
      ctx.beginPath();
      ctx.arc(Math.cos(pa) * 330 * open, Math.sin(pa) * 330 * open, 4 + 2 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(234,254,255,0.55)';
      ctx.fill();

      ctx.restore();
    }

    /* 中心核 */
    ctx.beginPath(); ctx.arc(0, 0, 18 + 6 * Math.sin(localT * 3.1), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(234,254,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('TRANCE  ·  ' + N + '-fold  ·  open ' + Math.round(open * 100) + '%', 96, 700);
  };

  /* ── S27 振动（你的频率）───────────────────────────────────────────────── */
  MODULES['sc.vibration'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cx = W / 2, cy = 470;
    const amp = 24 + 86 * smooth(0.05, 1.9, localT);
    const freq = 26 + 40 * smooth(0.2, 3.2, localT);
    const x0 = 180, x1 = W - 180;

    /* 主振动：上下双包络 */
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      for (let x = x0; x <= x1; x += 2) {
        const u = (x - x0) / (x1 - x0);
        const env = Math.sin(u * Math.PI);
        const y = cy + s * Math.sin(u * freq - localT * 18) * amp * env;
        if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = s < 0 ? 'rgba(94,242,208,0.85)' : 'rgba(94,242,208,0.28)';
      ctx.lineWidth = s < 0 ? 2 : 1;
      ctx.stroke();
    }

    /* 中线 */
    ctx.beginPath();
    ctx.moveTo(x0, cy); ctx.lineTo(x1, cy);
    ctx.strokeStyle = 'rgba(234,254,255,0.16)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 同心涟漪：由中线向外扩散 */
    for (let i = 0; i < 6; i++) {
      const ph = ((localT * 0.7 + i * 0.17) % 1);
      const rr = 40 + ph * 300;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rr, rr * 0.42, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(232,178,58,' + ((1 - ph) * 0.22).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* 竖向频谱细条 */
    const bars = 64;
    for (let i = 0; i < bars; i++) {
      const u = (i + 0.5) / bars;
      const x = x0 + u * (x1 - x0);
      const hh = (6 + 54 * Math.abs(Math.sin(u * freq * 0.9 - localT * 9))) * Math.sin(u * Math.PI);
      ctx.fillStyle = 'rgba(94,242,208,0.14)';
      ctx.fillRect(x - 1.5, cy + 150 - hh, 3, hh);
    }

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('FREQ ' + freq.toFixed(1) + '  ·  AMP ' + (amp / 110).toFixed(2) + '  ·  phase locked to t', 96, cy + 250);
  };

  /* ── S28 拼图（完成）──────────────────────────────────────────────────── */
  MODULES['sc.puzzle'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cols = 4, rows = 3;
    const pw = 140, gap = 8;
    const done = smooth(0.15, 2.9, localT);
    const g2 = gap * (1 - 0.95 * done);
    const gw = cols * pw + (cols - 1) * g2;
    const gh = rows * pw + (rows - 1) * g2;
    const x0 = (W - gw) / 2, y0 = 250;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        /* 每块从散落位置归位，右下最后到 */
        const st0 = clamp((localT - i * 0.085) / 2.2, 0, 1);
        const k = 1 - Math.pow(1 - st0, 3);
        const dx = (hash01(i * 3.7 + 0.4) - 0.5) * 520 * (1 - k);
        const dy = (hash01(i * 5.9 + 1.3) - 0.5) * 420 * (1 - k);
        const rot = (hash01(i * 7.1) - 0.5) * 0.9 * (1 - k);
        const x = x0 + c * (pw + g2) + dx;
        const y = y0 + r * (pw + g2) + dy;

        ctx.save();
        ctx.translate(x + pw / 2, y + pw / 2);
        ctx.rotate(rot);

        /* 块体 */
        ctx.beginPath();
        ctx.rect(-pw / 2, -pw / 2, pw, pw);
        ctx.fillStyle = 'rgba(232,178,58,' + (0.05 + 0.10 * k).toFixed(3) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgba(232,178,58,' + (0.30 + 0.45 * k).toFixed(3) + ')';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        /* 拼图凸起：半个圆鼓出格外 */
        const bx = (c % 2 === 0) ? pw / 2 : -pw / 2;
        const a0 = (c % 2 === 0) ? -Math.PI / 2 : Math.PI / 2;
        ctx.beginPath();
        ctx.arc(bx, 0, 21, a0, a0 + Math.PI);
        ctx.fillStyle = 'rgba(232,178,58,' + (0.05 + 0.10 * k).toFixed(3) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgba(232,178,58,' + (0.26 + 0.40 * k).toFixed(3) + ')';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        /* 归位后亮一下 */
        if (k > 0.985) {
          ctx.fillStyle = 'rgba(234,254,255,0.10)';
          ctx.fillRect(-pw / 2, -pw / 2, pw, pw);
        }
        ctx.restore();
      }
    }

    /* 完成框 */
    if (done > 0.55) {
      const a = (done - 0.55) / 0.45;
      ctx.strokeStyle = 'rgba(232,178,58,' + (a * 0.75).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.strokeRect(x0 - 18, y0 - 18, gw + 36, gh + 36);
    }

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    ctx.fillText('ASSEMBLY  ·  ' + (cols * rows) + ' pieces  ·  ' + Math.round(done * 100) + '% complete', 96, y0 + gh + 66);
  };

  /* ── S29 单点（被留下的孤立）──────────────────────────────────────────── */
  MODULES['sc.singlePoint'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;
    stage(ctx, t, st);

    const cx = W / 2, cy = 460;
    const N = 200;

    /* "You have left" 每重复一次收紧一档 —— 事件驱动，不是自算时间 */
    let hits = 0;
    for (let i = 0; i < cfg.events.length; i++) {
      if (cfg.events[i].type === 'text' && cfg.events[i].age >= 0) hits++;
    }
    const collapse = clamp(hits / 7, 0, 1);
    const R = 520 * (1 - collapse);

    /* 最近一次「You have left」的年龄 → 收缩瞬间的震动强度 */
    let lastAge = -1;
    for (let i = 0; i < cfg.events.length; i++) {
      const ev = cfg.events[i];
      if (ev.type !== 'text') continue;
      if (lastAge < 0 || ev.age < lastAge) lastAge = ev.age;
    }
    const shakeK = (lastAge >= 0 && lastAge < 0.55) ? Math.pow(1 - lastAge / 0.55, 2) : 0;
    const ringAge = (lastAge >= 0 && lastAge < 0.9) ? lastAge : -1;

    ctx.save();
    ctx.translate(cx, cy);
    const rotY = t * 0.33;
    const drawN = Math.max(1, Math.round(N * (1 - collapse)));
    const RS = Math.max(R, 1);

    /* ---------- 先算所有节点位置 ---------- */
    const PX = new Float32Array(drawN), PY = new Float32Array(drawN), PZ = new Float32Array(drawN);
    for (let i = 0; i < drawN; i++) {
      const z = 1 - (i / Math.max(1, drawN - 1)) * 2;
      const rr = Math.sqrt(Math.max(0, 1 - z * z));
      const ph = i * 2.399963;
      const x = Math.cos(ph) * rr * R;
      const y = z * R * 0.78;
      const zz = Math.sin(ph) * rr * R;
      const xr = x * Math.cos(rotY) - zz * Math.sin(rotY);
      const zr = x * Math.sin(rotY) + zz * Math.cos(rotY);
      /* 收缩瞬间：每个节点按自己的种子抖动 */
      const jk = shakeK * (0.30 + 0.70 * hash01(i * 7.31 + 1.7));
      const amp = 26 * jk;
      PX[i] = xr + Math.sin(t * 47 + i * 0.73) * amp;
      PY[i] = y + Math.cos(t * 53 + i * 1.31) * amp;
      PZ[i] = zr / RS;
    }

    /* ---------- 节点之间的连线 ---------- */
    const th = Math.max(30, R * 0.40);
    const th2 = th * th;
    for (let i = 0; i < drawN; i++) {
      const lim = Math.min(drawN, i + 13);
      for (let j = i + 1; j < lim; j++) {
        const dx = PX[i] - PX[j], dy = PY[i] - PY[j];
        const d2 = dx * dx + dy * dy;
        if (d2 > th2) continue;
        const d = Math.sqrt(d2);
        const a2 = (1 - d / th) * 0.30 * (0.45 + 0.55 * (PZ[i] + PZ[j] + 2) / 4);
        ctx.strokeStyle = 'rgba(150,220,244,' + a2.toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(PX[i], PY[i]);
        ctx.lineTo(PX[j], PY[j]);
        ctx.stroke();
      }
      if (i % 5 === 0) {
        const j2 = (i + Math.round(drawN * 0.37)) % drawN;
        if (j2 !== i) {
          const dx = PX[i] - PX[j2], dy = PY[i] - PY[j2];
          const d = Math.hypot(dx, dy);
          if (d < R * 1.6) {
            ctx.strokeStyle = 'rgba(94,242,208,' + (0.055 * (1 - d / (R * 1.6))).toFixed(3) + ')';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(PX[i], PY[i]);
            ctx.lineTo(PX[j2], PY[j2]);
            ctx.stroke();
          }
        }
      }
    }

    /* ---------- 节点：加大 + 辉光 ---------- */
    for (let i = 0; i < drawN; i++) {
      const dz = PZ[i];
      const r = 3.0 + 2.6 * (0.5 + 0.5 * dz);
      const a2 = 0.42 + 0.55 * (0.5 + 0.5 * dz);
      if (dz > 0.1) {
        const gg = ctx.createRadialGradient(PX[i], PY[i], 0, PX[i], PY[i], r * 3.4);
        gg.addColorStop(0, 'rgba(180,240,255,' + (0.20 * a2).toFixed(3) + ')');
        gg.addColorStop(1, 'rgba(94,242,208,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(PX[i], PY[i], r * 3.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(PX[i], PY[i], r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(234,254,255,' + a2.toFixed(3) + ')';
      ctx.fill();
    }

    /* ---------- 每次收缩打出一圈冲击环 ---------- */
    if (ringAge >= 0) {
      const u = clamp(ringAge / 0.9, 0, 1);
      const rr = 40 + u * (RS * 1.25);
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(234,254,255,' + ((1 - u) * 0.42).toFixed(3) + ')';
      ctx.lineWidth = (1 - u) * 4 + 0.6;
      ctx.stroke();
    }

    ctx.restore();

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.55)';
    const left = Math.max(1, Math.round(N * (1 - collapse)));
    ctx.fillText('OBJECTS  ' + N + '  →  ' + left + '   ·   "You have left" × ' + hits, 96, 700);

    /* 逐渐逼空的边缘暗角 */
    const vg = ctx.createRadialGradient(cx, cy, 120, cx, cy, 900);
    vg.addColorStop(0, 'rgba(5,7,14,0)');
    vg.addColorStop(1, 'rgba(5,7,14,' + (0.20 + 0.55 * collapse).toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  };


  /* ══════════════════════════════════════════════════════════════════════════
   *  文字层：persist = 歌词；pulse = 连喊大字

  /* ── S30 碎片（我若能把一切无意义的都擦掉）────────────────────────────── */
  MODULES['sc.fragment'] = function (ctx, t, localT, cfg) {
    const st = cfg.state;
    stage(ctx, t, st);

    const X0 = 340, X1 = 1580, Y0 = 190, Y1 = 744;
    const COL = 9, ROW = 6;
    const mx0 = (X0 + X1) / 2, my0 = (Y0 + Y1) / 2;

    /* 共享抖动的顶点：邻居共用同一个顶点，裂缝自然连成网 */
    const vx = [], vy = [];
    for (let i = 0; i <= COL; i++) {
      vx[i] = []; vy[i] = [];
      for (let j = 0; j <= ROW; j++) {
        const bx = X0 + (X1 - X0) * (i / COL);
        const by = Y0 + (Y1 - Y0) * (j / ROW);
        const inner = (i === 0 || i === COL || j === 0 || j === ROW) ? 0.3 : 1;
        vx[i][j] = bx + (hash01(i * 7.13 + j * 13.7) - 0.5) * 24 * inner;
        vy[i][j] = by + (hash01(i * 3.31 + j * 21.9 + 5) - 0.5) * 24 * inner;
      }
    }

    const crack = smooth(0.10, 2.30, localT);
    const burst = smooth(2.42, 2.62, localT);
    const age = Math.max(0, localT - 2.50);
    const fade = 1 - 0.72 * smooth(0, 0.85, age);

    let n = 0;
    const pts = [];
    for (let i = 0; i < COL; i++) {
      for (let j = 0; j < ROW; j++) {
        n++;
        pts[0] = vx[i][j]; pts[1] = vy[i][j];
        const px = [vx[i][j], vx[i + 1][j], vx[i + 1][j + 1], vx[i][j + 1]];
        const py = [vy[i][j], vy[i + 1][j], vy[i + 1][j + 1], vy[i][j + 1]];
        const cmx = (px[0] + px[1] + px[2] + px[3]) / 4;
        const cmy = (py[0] + py[1] + py[2] + py[3]) / 4;
        const dx = cmx - mx0, dy = cmy - my0;
        const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        const sp = 90 + hash01(i * 11.7 + j * 5.3) * 320;
        const ox = (dx / len) * sp * age + (hash01(i * 2.7 + j * 9.1) - 0.5) * 46 * age;
        const oy = (dy / len) * sp * age + (hash01(i * 4.1 + j * 6.7) - 0.5) * 46 * age + 90 * age * age;
        const rot = (hash01(i * 1.9 + j * 3.7) - 0.5) * 2.6 * age;

        ctx.save();
        ctx.translate(cmx + ox, cmy + oy);
        if (rot) ctx.rotate(rot);
        ctx.translate(-cmx, -cmy);

        ctx.beginPath();
        ctx.moveTo(px[0], py[0]);
        for (let k = 1; k < 4; k++) ctx.lineTo(px[k], py[k]);
        ctx.closePath();

        const near = 1 - len / 900;
        ctx.fillStyle = 'rgba(160,190,235,' + (fade * (0.025 + 0.06 * near)).toFixed(3) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgba(234,254,255,' + (fade * (0.05 + 0.36 * crack) * (0.4 + 0.6 * near)).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
    }

    /* 环境碎屑：一直在飘的细小玻璃屑，给空画面一点空气 */
    for (let i = 0; i < 46; i++) {
      const sx = hash01(i * 4.7 + 1.1) * CFG.W;
      const sy0 = hash01(i * 8.3 + 2.7) * CFG.H;
      const sp = 8 + hash01(i * 2.9 + 5.5) * 22;
      const sy = ((sy0 + t * sp) % (CFG.H + 120)) - 60;
      const sxx = sx + Math.sin(t * 0.7 + i) * 18;
      const sz = 2 + hash01(i * 6.1 + 3.3) * 5;
      ctx.save();
      ctx.translate(sxx, sy);
      ctx.rotate(t * 0.5 + i);
      ctx.beginPath();
      ctx.moveTo(-sz, -sz * 0.6);
      ctx.lineTo(sz, 0);
      ctx.lineTo(-sz * 0.4, sz);
      ctx.closePath();
      ctx.fillStyle = 'rgba(200,225,245,' + (0.05 + 0.07 * hash01(i * 9.7 + 0.5)).toFixed(3) + ')';
      ctx.fill();
      ctx.restore();
    }

    /* 爆点红光 */
    if (age > 0 && age < 0.7) {
      const g = 1 - age / 0.7;
      const rg = ctx.createRadialGradient(mx0, my0, 0, mx0, my0, 640);
      rg.addColorStop(0, 'rgba(255,47,109,' + (0.24 * g).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(255,47,109,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(mx0 - 640, my0 - 640, 1280, 1280);
    }

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.48)';
    ctx.fillText('INTEGRITY  ' + Math.round((1 - burst * 0.62) * 100) + '%   ·   SHARDS ' + n, X0, Y1 + 40);
  };

    /* 中心：一枚很慢的呼吸点 */
    const br = 1 + 0.10 * Math.sin(localT * 1.3);
    ctx.beginPath(); ctx.arc(cx, cy, 6 * br, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(234,254,255,0.9)'; ctx.fill();

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,0.45)';
    ctx.fillText('AFTERGLOW  ·  ' + Math.round(clamp(localT / 14.4, 0, 1) * 100) + '%', 96, 232);
  };

  /* ── S46 终卡（自己画字，好让最后一秒能真的淡到黑）───────────────────── */
  MODULES['sc.finalCard'] = function (ctx, t, localT, cfg) {
    const { W, H } = CFG;
    const st = cfg.state;

    ctx.fillStyle = '#05070e';
    ctx.fillRect(0, 0, W, H);

    /* 余烬 */
    for (let i = 0; i < 70; i++) {
      const y = H - ((localT * (30 + hash01(i * 3.9) * 60) + hash01(i * 7.3) * H) % H);
      const x = hash01(i * 5.1) * W;
      ctx.fillStyle = 'rgba(234,254,255,' + (0.05 + 0.14 * hash01(i * 2.7)).toFixed(3) + ')';
      ctx.fillRect(x, y, 1.6, 1.6);
    }

    /* EXECUTION：前 1.2 秒是宣告，之后退成痕迹 */
    const head = 1 - smooth(0.6, 1.6, localT);
    ctx.save();
    ctx.textAlign = 'center';
    mono(ctx, 56, 'bold');
    ctx.fillStyle = 'rgba(234,254,255,' + (0.92 * head + 0.10).toFixed(3) + ')';
    ctx.fillText('EXECUTION', W / 2, 812);
    ctx.restore();

    /* 行刑指令 */
    const cmd = smooth(0.55, 1.15, localT);
    if (cmd > 0) {
      ctx.save();
      ctx.globalAlpha = cmd;
      ctx.textAlign = 'center';
      mono(ctx, 30, 'bold');
      ctx.fillStyle = 'rgba(234,254,255,0.72)';
      mono(ctx, 44, 'bold');
      ctx.fillStyle = 'rgba(234,254,255,0.92)';
      ctx.fillText('world.execute(me);', W / 2, 466);
      mono(ctx, 30, 'bold');
      mono(ctx, 15, '');
      ctx.fillStyle = 'rgba(140,215,235,0.45)';
      ctx.fillText('process finished with exit code 0', W / 2, 512);
      ctx.restore();
    }

    /* 光标：只在最后闪 */
    const blinkOn = Math.sin(localT * 5.2) > 0;
    if (cmd > 0.9 && blinkOn) {
      ctx.save();
      mono(ctx, 44, 'bold');
      const wid = ctx.measureText('world.execute(me);').width;
      ctx.restore();
      ctx.fillStyle = 'rgba(94,242,208,0.85)';
      ctx.fillRect(W / 2 + wid / 2 + 14, 436, 12, 30);
    }

    /* 收尾：最后 1.6 秒全部淡到黑（模块自己压黑，因为文字层画在模块之后）*/
    const endFade = smooth(4.5, 5.9, localT);
    if (endFade > 0) {
      ctx.fillStyle = 'rgba(5,7,14,' + endFade.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    mono(ctx, 14, '');
    ctx.fillStyle = 'rgba(140,215,235,' + (0.42 * (1 - endFade)).toFixed(3) + ')';
    ctx.fillText('END  ·  ' + Math.round(localT * 10) / 10 + ' s', 96, 232);
  };

  /* 小工具：给 S39 羽毛用 */
  function rgFa(hex, a) {
    return rgba(hex, a);
  }

  /* ══════════════════════════════════════════════════════════════════════════
   *  公开渲染接口
   * ══════════════════════════════════════════════════════════════════════════*/
  function renderAt(tIn) {
    const n = Number(tIn);
    const t = Number.isFinite(n) ? Math.max(0, n) : 0;
    lastT = t;

    const tc = Math.min(t, V2_TOTAL);
    const ratio = tc / V2_TOTAL;
    const idx = findShot(ratio);
    const shot = SHOTS[idx];
    const start = shot.startRatio * V2_TOTAL;
    const end = shot.endRatio * V2_TOTAL;
    const localT = tc - start;

    const cfg = cfgOf(shot, tc);
    const st = cfg.state;

    /* 本镜 → bufB */
    paintShot(actxB, shot, tc, localT, st, cfg);

    let composed = false;
    const tin = shot.transitionIn;
    if (idx > 0 && tin && tin.type !== 'cut' && tin.dur > 0) {
      const p = (tc - start) / tin.dur;
      if (p < 1) {
        const prev = SHOTS[idx - 1];
        const ptc = prev.endRatio * V2_TOTAL - 1e-4;
        const pcfg = cfgOf(prev, ptc);
        paintShot(actxA, prev, ptc, prev.endRatio * V2_TOTAL - prev.startRatio * V2_TOTAL - 1e-4, pcfg.state, pcfg);
        compose(ctx, tin.type, clamp(p, 0, 1), bufA, bufB);
        composed = true;
      }
    }

    if (!composed) {
      const nxt = SHOTS[idx + 1];
      const tout = shot.transitionOut;
      if (nxt && tout && tout.type !== 'cut' && tout.dur > 0 &&
          nxt.transitionIn && nxt.transitionIn.type === 'cut') {
        const p = 1 - (end - tc) / tout.dur;
        if (p > 0 && p < 1) {
          const ntc = nxt.startRatio * V2_TOTAL + 1e-4;
          const ncfg = cfgOf(nxt, ntc);
          paintShot(actxA, nxt, ntc, 1e-4, ncfg.state, ncfg);
          compose(ctx, tout.type, clamp(p, 0, 1), bufB, bufA);
          composed = true;
        }
      }
    }

    if (!composed) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.drawImage(bufB, 0, 0);
    }

    /* 故障带（只作用于画面，不作用于 HUD） */
    ctx.setTransform(CFG.dpr, 0, 0, CFG.dpr, 0, 0);
    glitchFrame(ctx, tc, st.glitch, st.glitchAmp);

    /* 文字层 */
    ctx.setTransform(CFG.dpr, 0, 0, CFG.dpr, 0, 0);
    if (!OWNS_TEXT[shot.renderModule]) drawTextLayer(ctx, tc, st);

    /* HUD */
    drawTUI(ctx, t, st);

    /* 事件闪光 */
    if (st.flash > 0.001) {
      const { W, H } = CFG;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.pow(clamp(st.flash, 0, 1), 1.6) * 0.85;
      ctx.fillStyle = st.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /* 处决冲刷 */
    if (st.flush > 0.001) {
      const { W, H } = CFG;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp(st.flush, 0, 1);
      ctx.fillStyle = st.flushColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /* 后期质感 */
    postFX(ctx, tc);

    /* 全片收尾：最后 1.2 秒连同 HUD 一起淡到黑 */
    const tail = clamp((t - (V2_TOTAL - 1.2)) / 1.2, 0, 1);
    if (tail > 0) {
      ctx.setTransform(CFG.dpr, 0, 0, CFG.dpr, 0, 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(5,7,14,' + tail.toFixed(3) + ')';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.globalAlpha = 1;
    }

    window.__LAST_T__ = t;
    window.__STATE__ = st;
    window.__SCENE__ = {
      index: idx,
      id: shot.id,
      module: shot.renderModule,
      next: SHOTS[idx + 1] ? SHOTS[idx + 1].id : null,
      localT: localT,
      text: (function () { const c = textAt(tc); return c ? c.text : null; })()
    };
    window.__FRAME_INDEX__ = (window.__FRAME_INDEX__ || 0) + 1;
    return t;
  }

  /* ── 启动 ──────────────────────────────────────────────────────────────── */
  function boot() {
    setupCanvas();
    fitStage();

    // ?t=12.345 —— 页面加载后自动渲染该时刻
    const q = new URLSearchParams(location.search).get('t');
    const t0 = (q !== null && Number.isFinite(Number(q))) ? Math.max(0, Number(q)) : 0;

    renderAt(t0);

    // 字体就绪后按同一个 t 再画一次，然后置 READY（供 Playwright 等待）
    const done = () => {
      renderAt(lastT);
      window.__READY__ = true;
    };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(done, done);
    } else {
      done();
    }

    window.addEventListener('resize', () => {
      setupCanvas();
      fitStage();
      renderAt(lastT);
    });

    // 手动擦洗（按键重复由系统触发，页面里没有任何 JS 时钟）
    window.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 1 : 1 / CFG.FPS;
      if (e.key === 'ArrowRight') { renderAt(lastT + step); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { renderAt(lastT - step); e.preventDefault(); }
      else if (e.key === 'Home') { renderAt(0); e.preventDefault(); }
      else if (e.key === 'End') { renderAt(CFG.DURATION); e.preventDefault(); }
    });
  }

  /* ── 导出 ──────────────────────────────────────────────────────────────── */
  window.CFG = CFG;
  window.TIMELINE = TIMELINE;
  window.EVENTS = EVENTS;
  window.SCENES = SCENES;
  window.SHOTS = SHOTS;
  window.MODULES_V2 = MODULES;
  window.findShot = findShot;
  window.textAt = textAt;
  window.sceneAt = sceneAt;
  window.stateAt = stateAt;
  window.timecode = timecode;
  window.renderAt = renderAt;
  window.DURATION = CFG.DURATION;
  window.FPS = CFG.FPS;

  // 模块单独暴露，方便在控制台 / Playwright 里单独验证某个图层
  window.MODULES = {
    drawBackground: drawBackground,
    drawGrid: drawGrid,
    drawParticles: drawParticles,
    drawShape: drawShape,
    drawCodeText: drawCodeText,
    drawTUI: drawTUI
  };

  window.__READY__ = false;
  boot();
})();
</script>
</body>
</html>
